<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dino dolina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* --u: stoti dio visine, a na uskim zaslonima dvjestoti dio sirine. Sve velicine idu preko njega. */
:root{--u:min(1vh,.5vw); --ink:#17332b; --gold:#ffcf3f; --ok:#35d07f; --s1:#8fdcff; --s2:#d4f3ff; --s3:#fff3c9; --g1:#8bd45a; --g2:#4fae4a; --h1:#7cc7a0; --h2:#55b07a}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden; font-family:"Fredoka",system-ui,"Segoe UI",Roboto,sans-serif; color:#fff; user-select:none; -webkit-user-select:none; background:#17332b}
[hidden]{display:none!important}
button{font:inherit; color:inherit; border:0; padding:0; cursor:pointer; background:none}
.emo{font-family:system-ui,"Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* ---------- dolina ---------- */
body.s0{--s1:#ffb199; --s2:#ffd9b0; --s3:#fff1c4; --h1:#e7a98f; --h2:#9cc98a}
body.s1{--s1:#58c4f6; --s2:#b4ecff; --s3:#eafbe0; --h1:#7cc7a0; --h2:#55b07a}
body.s2{--s1:#5a4aa8; --s2:#f0789a; --s3:#ffcb7d; --h1:#a06aa8; --h2:#5f9a78; --g1:#7cc257; --g2:#3f9446}
#scene{position:fixed; inset:0; overflow:hidden; background:linear-gradient(var(--s1),var(--s2) 38%,var(--s3) 62%)}
#sun{position:absolute; right:14%; top:9%; width:calc(var(--u)*16); height:calc(var(--u)*16); border-radius:50%; background:radial-gradient(circle,#fffbe0,#ffe27a 60%,#ffd24a); box-shadow:0 0 calc(var(--u)*10) #fff3a8, 0 0 calc(var(--u)*26) #ffe98a90}
body.s2 #sun{top:30%; background:radial-gradient(circle,#fff2c0,#ffb057 60%,#ff8a4a); box-shadow:0 0 calc(var(--u)*10) #ffc48a, 0 0 calc(var(--u)*26) #ff9a6a90}
.cloud{position:absolute; height:calc(var(--u)*5); border-radius:calc(var(--u)*5); background:#ffffffd8; animation:drift linear infinite; box-shadow:calc(var(--u)*5) calc(var(--u)*-2.4) 0 calc(var(--u)*1) #ffffffd8, calc(var(--u)*11) calc(var(--u)*-.6) 0 calc(var(--u)*-.6) #ffffffd8}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#land{position:absolute; left:0; right:0; bottom:0; height:46%; transition:height .9s cubic-bezier(.3,.9,.3,1)}
body.run #land{height:80%}
#volcano{position:absolute; left:6%; bottom:calc(100% - var(--u)*7); width:calc(var(--u)*56); height:calc(var(--u)*36)}
#volcano svg{width:100%; height:100%; overflow:visible}
.puff{animation:puff 5s ease-out infinite; transform-box:fill-box; transform-origin:center}
.puff:nth-child(2){animation-delay:-1.7s}.puff:nth-child(3){animation-delay:-3.4s}
@keyframes puff{0%{transform:translate(0,0) scale(.4); opacity:0}15%{opacity:.85}100%{transform:translate(40px,-110px) scale(1.8); opacity:0}}
#hills{position:absolute; left:0; bottom:calc(100% - var(--u)*9); width:100%; height:calc(var(--u)*26)}
#ground{position:absolute; inset:calc(var(--u)*8) 0 0 0; background:linear-gradient(var(--g1),var(--g2))}
#ground:before{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 20% 30%,#ffffff26 0 8%,transparent 9%),radial-gradient(ellipse at 70% 55%,#ffffff1c 0 10%,transparent 11%),radial-gradient(ellipse at 42% 80%,#0000000f 0 12%,transparent 13%),radial-gradient(ellipse at 88% 18%,#0000000d 0 9%,transparent 10%)}
#groundTop{position:absolute; left:0; top:calc(var(--u)*1); width:100%; height:calc(var(--u)*8)}
.palm{position:absolute; bottom:calc(var(--u)*-2); width:calc(var(--u)*34); height:calc(var(--u)*52); pointer-events:none; z-index:6; transition:opacity .6s, transform .9s}
.palm svg{width:100%; height:100%; overflow:visible}
.palm.l{left:calc(var(--u)*-9)} .palm.r{right:calc(var(--u)*-9); transform:scaleX(-1)}
body.play .palm{opacity:0; transform:translateY(20%)} body.play .palm.r{transform:scaleX(-1) translateY(20%)}
.frond{transform-box:fill-box; transform-origin:0% 100%; animation:sway 5s ease-in-out infinite alternate}
g:nth-of-type(2n) > .frond{animation-duration:6.5s; animation-delay:-2s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}

/* ---------- dinosauri ---------- */
.dn{display:inline-block; width:calc(var(--u)*var(--w,16)); line-height:0; flex:none}
.dn svg,.eg svg{width:100%; display:block; overflow:visible}
.eg{display:inline-block; width:calc(var(--u)*var(--w,8)); line-height:0; flex:none}
.dino .eye{transform-box:fill-box; transform-origin:center; animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.dino .dbody{transform-origin:50% 91%; animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.025) scaleX(.992)}}
.baby{position:relative; display:inline-block; width:calc(var(--u)*var(--w,16)); line-height:0; flex:none}
.baby .dn{width:100%} .baby .shell{position:absolute; left:20%; bottom:-7%; width:58%; overflow:visible}
.sil svg{filter:brightness(0) opacity(.72)}
.sil .eye{animation:none}

/* ---------- zajednicko sucelje ---------- */
.glass{background:#0f3a30b8; border:calc(var(--u)*.25) solid #ffffff59; box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*4) #0005, inset 0 calc(var(--u)*.4) 0 #ffffff26; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.panel{background:linear-gradient(#fffdf5ee,#fff4dcee); border:calc(var(--u)*.45) solid #fff; box-shadow:0 calc(var(--u)*1.4) calc(var(--u)*4) #1a3a2a55; color:var(--ink)}
.round{position:fixed; top:calc(var(--u)*2); width:calc(var(--u)*8.5); height:calc(var(--u)*8.5); min-width:38px; min-height:38px; border-radius:50%; font-size:calc(var(--u)*4.2); display:flex; align-items:center; justify-content:center;
  text-decoration:none; z-index:30; background:#ffffffee; box-shadow:0 calc(var(--u)*.7) 0 #0003; transition:transform .12s}
.round:hover{transform:scale(1.1)}
#home,#back{left:calc(var(--u)*2)} #l1{left:calc(var(--u)*12.5)} #l2{left:calc(var(--u)*23)} #l3{left:calc(var(--u)*33.5)} #l4{left:calc(var(--u)*44)} #mute{right:calc(var(--u)*2)}
#prompt{position:fixed; top:calc(var(--u)*2); left:50%; transform:translateX(-50%); width:max-content; max-width:calc(var(--u)*150); min-height:calc(var(--u)*8.5); border-radius:calc(var(--u)*5); padding:calc(var(--u)*.8) calc(var(--u)*3.4) calc(var(--u)*.8) calc(var(--u)*1.2);
  display:flex; align-items:center; gap:calc(var(--u)*1.8); font-size:calc(var(--u)*3.7); font-weight:600; line-height:1.2; z-index:25}
#how{flex:none; width:calc(var(--u)*6.6); height:calc(var(--u)*6.6); border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:calc(var(--u)*3.6); animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-.6)) scale(1.06)}}
#pips{position:fixed; top:calc(var(--u)*14.6); left:50%; transform:translateX(-50%); display:flex; gap:calc(var(--u)*1.4); z-index:24; align-items:center}
#pips i{width:calc(var(--u)*5); height:calc(var(--u)*1.6); border-radius:calc(var(--u)); background:#ffffff80; box-shadow:0 1px 2px #0003}
#pips i.on{background:var(--gold); box-shadow:0 0 calc(var(--u)*2) var(--gold)} #pips i.now{background:#fff}

/* ---------- polje igre ---------- */
#field{position:fixed; inset:0; z-index:8}
#board{position:absolute; left:0; right:0; top:calc(var(--u)*17.5); bottom:calc(var(--u)*3); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*3)}
#hero{position:absolute; left:0; top:0; will-change:transform; pointer-events:none; z-index:3}
#hero .in{display:block; transform-origin:50% 60%}
#hero.walk .in{animation:walk .34s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(calc(var(--u)*-1.2)) rotate(-3deg)}}
.it{position:absolute; left:0; top:0; width:calc(var(--u)*13); height:calc(var(--u)*13); margin:calc(var(--u)*-6.5) 0 0 calc(var(--u)*-6.5); display:flex; align-items:center; justify-content:center; will-change:transform; z-index:2}
.it:before{content:""; position:absolute; left:14%; right:14%; bottom:2%; height:16%; border-radius:50%; background:#0000002e}
.it .in{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:calc(var(--u)*8.4); animation:hop 2.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(calc(var(--u)*-1))}}
.it svg{width:74%; height:74%; filter:drop-shadow(0 calc(var(--u)*.4) 0 #0003)}
.stone{width:82%; height:82%; border-radius:38% 42% 40% 44%; background:linear-gradient(#fdf6e3,#e7d6ad); border:calc(var(--u)*.45) solid #fff; box-shadow:0 calc(var(--u)*.7) 0 #b79f6a; color:var(--ink); font-weight:700; font-size:calc(var(--u)*7); display:flex; align-items:center; justify-content:center; line-height:1}
.it.pop .in{animation:popout .35s forwards} .it.pop:before{opacity:0}
.it.bad .in{animation:shake .4s}
@keyframes popout{to{transform:scale(1.8); opacity:0}}
@keyframes shake{20%,60%{transform:translateX(calc(var(--u)*-1.4))}40%,80%{transform:translateX(calc(var(--u)*1.4))}}
#eq{position:fixed; top:calc(var(--u)*18.5); left:50%; transform:translateX(-50%); z-index:9; border-radius:calc(var(--u)*3); padding:calc(var(--u)*.4) calc(var(--u)*3.4); font-size:calc(var(--u)*7); font-weight:700; letter-spacing:calc(var(--u)*.6); line-height:1.2}
.spark{position:absolute; left:0; top:0; font-size:calc(var(--u)*5); pointer-events:none; z-index:20}
#pad{position:fixed; right:calc(var(--u)*3); bottom:calc(var(--u)*3); z-index:20; display:grid; grid-template-columns:repeat(3,calc(var(--u)*7.4)); grid-template-rows:repeat(2,calc(var(--u)*7.4)); gap:calc(var(--u)*.8)}
#pad button{border-radius:calc(var(--u)*1.8); background:#ffffffe0; color:var(--ink); font-size:calc(var(--u)*3.6); font-weight:700; box-shadow:0 calc(var(--u)*.7) 0 #0004; transition:transform .08s, background .08s}
#pad button.on{transform:translateY(calc(var(--u)*.5)); background:var(--gold)}
#pad [data-k=u]{grid-column:2} #pad [data-k=l]{grid-column:1; grid-row:2} #pad [data-k=d]{grid-column:2; grid-row:2} #pad [data-k=r]{grid-column:3; grid-row:2}

/* ---------- zadaci misem ---------- */
.tank{position:relative; border-radius:calc(var(--u)*5); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; align-content:center; gap:calc(var(--u)*1) calc(var(--u)*2); padding:calc(var(--u)*2.4) calc(var(--u)*3.4)}
button.tank{transition:transform .15s} button.tank:hover{transform:scale(1.04); border-color:var(--gold)}
.cr{font-size:calc(var(--u)*var(--s,9)); line-height:1.15; display:inline-block}
.pk{cursor:pointer; transition:transform .12s; display:flex; align-items:flex-end} .pk:hover{transform:scale(1.07); filter:drop-shadow(0 0 calc(var(--u)*1.4) #fff)}
.mv{position:absolute; left:0; top:0; margin:calc(var(--u)*-6.4) 0 0 calc(var(--u)*-8.5); width:calc(var(--u)*17); cursor:pointer; will-change:transform; line-height:0}
.mv:hover{filter:drop-shadow(0 0 calc(var(--u)*1.4) #ffe27a)} .mv.gone{animation:popout .35s forwards; pointer-events:none}
.mv .dn{width:100%}
.opts{display:flex; gap:calc(var(--u)*3.5); justify-content:center; align-items:center}
.opt{width:calc(var(--u)*19); height:calc(var(--u)*19); border-radius:50%; background:radial-gradient(circle at 32% 26%,#fff,#fff7e2 55%,#f3dfae); color:var(--ink); font-size:calc(var(--u)*11); font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center; box-shadow:0 calc(var(--u)*1.2) 0 #9c7d3a88, 0 0 0 calc(var(--u)*.7) #ffffffb0; transition:transform .12s, box-shadow .12s; animation:drop .5s backwards}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
@keyframes drop{0%{transform:translateY(calc(var(--u)*14)) scale(.4); opacity:0}70%{transform:translateY(calc(var(--u)*-1.5)) scale(1.04)}}
.opt:hover{transform:translateY(calc(var(--u)*-1.2)) scale(1.06); box-shadow:0 calc(var(--u)*1.2) 0 #9c7d3a88, 0 0 0 calc(var(--u)*1.1) var(--gold)}
.opt.card{border-radius:calc(var(--u)*5); width:calc(var(--u)*34); height:calc(var(--u)*27); font-size:calc(var(--u)*14)}
.opt.sw{font-size:0}
.no{animation:shake .4s}
.right{box-shadow:0 0 0 calc(var(--u)*1.2) var(--ok), 0 0 calc(var(--u)*5) var(--ok)!important}
.hint{animation:pulse 1s infinite; outline:calc(var(--u)*.9) solid var(--ok); outline-offset:calc(var(--u)*.4)}
@keyframes pulse{50%{transform:scale(1.08)}}
.row{display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*1.6)}
.tile{width:calc(var(--u)*13); height:calc(var(--u)*15); border-radius:calc(var(--u)*3.2); display:flex; align-items:center; justify-content:center; font-size:calc(var(--u)*8); font-weight:700}
.tile.q{border-style:dashed; border-color:var(--gold); color:#d79b00}
.plus{font-size:calc(var(--u)*13); font-weight:700; text-shadow:0 calc(var(--u)*.5) 0 #0004}
.badge{position:absolute; left:50%; bottom:calc(var(--u)*-3.4); transform:translateX(-50%); background:var(--gold); color:var(--ink); font-weight:700; font-size:calc(var(--u)*5); line-height:1; padding:calc(var(--u)*.7) calc(var(--u)*2.2); border-radius:calc(var(--u)*3); box-shadow:0 calc(var(--u)*.6) 0 #0003}
.pic{min-width:calc(var(--u)*40); max-width:calc(var(--u)*76); min-height:calc(var(--u)*30); border-radius:calc(var(--u)*6); display:flex; align-items:center; justify-content:center; flex-wrap:wrap; align-content:center; gap:calc(var(--u)*1); font-size:calc(var(--u)*17); position:relative; padding:calc(var(--u)*2) calc(var(--u)*4)}
.pic.sq{flex-direction:column; flex-wrap:nowrap; gap:calc(var(--u)*.6)}
.word{font-size:calc(var(--u)*5.4); font-weight:700; letter-spacing:calc(var(--u)*.7); background:var(--ink); color:#fff; border-radius:calc(var(--u)*2); padding:0 calc(var(--u)*2.4); line-height:1.45}
.food{position:absolute; left:0; top:0; width:calc(var(--u)*13); height:calc(var(--u)*13); font-size:calc(var(--u)*9); line-height:calc(var(--u)*13); text-align:center; border-radius:50%; background:#ffffffc0; box-shadow:0 calc(var(--u)*.7) 0 #0002; transition:transform .5s cubic-bezier(.5,-.3,.6,1), opacity .5s; cursor:pointer}
.food:hover{box-shadow:0 0 0 calc(var(--u)*.8) var(--gold)}
.chomp{animation:chomp .35s}
@keyframes chomp{40%{transform:scale(1.08,.94)}}
#mic{display:flex; align-items:center; gap:calc(var(--u)*2.5); min-height:calc(var(--u)*13)}
#micDot{position:relative; width:calc(var(--u)*12); height:calc(var(--u)*12); border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:calc(var(--u)*6.4); opacity:.6; transition:opacity .2s}
#mic.on #micDot{opacity:1; background:var(--gold)}
#mic.on #micDot:before,#mic.on #micDot:after{content:""; position:absolute; inset:0; border-radius:50%; border:calc(var(--u)*.6) solid var(--gold); animation:wave 1.4s ease-out infinite}
#mic.on #micDot:after{animation-delay:.7s}
@keyframes wave{to{transform:scale(2.1); opacity:0}}
#heard{font-size:calc(var(--u)*4); font-weight:600; min-width:calc(var(--u)*30); text-shadow:0 1px 3px #0008}
#skip{font-size:calc(var(--u)*4.2); width:calc(var(--u)*9); height:calc(var(--u)*9); border-radius:50%; background:#ffffffe8}

/* ---------- karta ---------- */
.screen{position:fixed; inset:0; z-index:12; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
#map{gap:calc(var(--u)*2.2); padding-top:calc(var(--u)*1)}
h1{margin:0; font-size:calc(var(--u)*9.5); font-weight:700; line-height:1; letter-spacing:calc(var(--u)*.2); color:#fff; text-shadow:0 calc(var(--u)*.7) 0 #1c6b4c, 0 calc(var(--u)*1.4) calc(var(--u)*3) #0d3b2a80}
h1 b{color:var(--gold)}
#cards{display:grid; grid-template-columns:repeat(5,calc(var(--u)*34.5)); gap:calc(var(--u)*2.4) calc(var(--u)*2.2)}
.dc{position:relative; height:calc(var(--u)*34.5); border-radius:calc(var(--u)*4.5); display:flex; flex-direction:column; align-items:center; padding:calc(var(--u)*1) 0 calc(var(--u)*1.2); cursor:pointer; transition:transform .14s, box-shadow .14s}
.dc:hover,.dc.sel{transform:translateY(calc(var(--u)*-1)) scale(1.035); box-shadow:0 calc(var(--u)*1.6) calc(var(--u)*4) #1a3a2a66, 0 0 0 calc(var(--u)*.9) var(--gold)}
.dc.champ{background:linear-gradient(#fff9d6,#ffe9a0)}
.dc .art{height:calc(var(--u)*21.5); width:100%; display:flex; align-items:flex-end; justify-content:center}
.dc .nm{font-size:calc(var(--u)*2.7); font-weight:700; text-transform:capitalize; line-height:1.3; letter-spacing:.02em}
.dc .crown{position:absolute; right:calc(var(--u)*1.4); top:calc(var(--u)*.6); font-size:calc(var(--u)*5); transform:rotate(14deg)}
.dc .ps{display:flex; gap:calc(var(--u)*1.6); margin-top:calc(var(--u)*.3)}
.pp{position:relative; width:calc(var(--u)*6.4); height:calc(var(--u)*6.4); border-radius:50%; background:#fff; box-shadow:0 calc(var(--u)*.5) 0 #d8c59a, 0 0 0 calc(var(--u)*.3) #ecdcb4; font-size:calc(var(--u)*3.2); display:flex; align-items:center; justify-content:center; transition:transform .12s}
.pp:hover{transform:scale(1.15)}
.pp.lock{opacity:.4; box-shadow:none; background:#e9dfc8}
.pp.done{background:var(--gold); box-shadow:0 calc(var(--u)*.5) 0 #c9971a}
.pp.next{animation:pulse 1.4s infinite; box-shadow:0 calc(var(--u)*.5) 0 #d8c59a, 0 0 0 calc(var(--u)*.6) var(--ok)}
.pp .st{position:absolute; bottom:calc(var(--u)*-1.5); left:50%; transform:translateX(-50%); font-size:calc(var(--u)*1.5); white-space:nowrap; letter-spacing:calc(var(--u)*-.2)}
.st i,#wstars i{font-style:normal; opacity:.25; filter:grayscale(1)} .st i.on,#wstars i.on{opacity:1; filter:none}
#loading{font-size:calc(var(--u)*2.4); font-weight:600; min-height:calc(var(--u)*3); color:#fff; text-shadow:0 1px 3px #0008}

/* ---------- kraj razine ---------- */
#win{background:radial-gradient(circle at 50% 42%,#2f8a63ee,#0c2b22f2 70%); z-index:28; gap:calc(var(--u)*1.6)}
#rays{position:absolute; left:50%; top:40%; width:calc(var(--u)*150); height:calc(var(--u)*150); margin:calc(var(--u)*-75); border-radius:50%; background:repeating-conic-gradient(#ffffff14 0 12deg,transparent 12deg 24deg); animation:turn 30s linear infinite; pointer-events:none}
@keyframes turn{to{transform:rotate(360deg)}}
#wart{position:relative; height:calc(var(--u)*44); width:calc(var(--u)*70); display:flex; align-items:flex-end; justify-content:center}
#wart .wob{animation:wob .28s ease-in-out infinite alternate; transform-origin:50% 90%}
@keyframes wob{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
#wart .pop{animation:grow .7s cubic-bezier(.2,1.7,.4,1) backwards; transform-origin:50% 95%}
@keyframes grow{from{transform:scale(.25)}}
#wart .crown{position:absolute; left:50%; top:calc(var(--u)*-6); font-size:calc(var(--u)*11); transform:translateX(-50%); animation:grow .7s .5s cubic-bezier(.2,1.7,.4,1) backwards}
#wname{position:relative; font-size:calc(var(--u)*5.4); font-weight:700; text-transform:capitalize; letter-spacing:.03em; background:#fff; color:var(--ink); border-radius:calc(var(--u)*4); padding:0 calc(var(--u)*4); line-height:1.5}
#wstars{position:relative; font-size:calc(var(--u)*9); letter-spacing:calc(var(--u)*1.2); line-height:1.1}
#wstars i.on{display:inline-block; animation:grow .5s backwards} #wstars i:nth-child(2){animation-delay:.25s} #wstars i:nth-child(3){animation-delay:.5s}
#win .btns{position:relative}
#win .btns button{font-size:calc(var(--u)*6.4); width:calc(var(--u)*17); height:calc(var(--u)*12.5); border-radius:calc(var(--u)*5); margin:0 calc(var(--u)*1.2); background:#fff; box-shadow:0 calc(var(--u)*.9) 0 #b9c9b0; transition:transform .12s}
#win .btns button:hover{transform:scale(1.07)}
#win .btns button.go{background:var(--gold); box-shadow:0 calc(var(--u)*.9) 0 #c79a00}
</style>
</head>
<body class="s1">
<div id="defs"></div>

let ac = null, muted = false;
function ensureAc(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state === 'suspended') ac.resume(); }catch(e){} return ac; }
function tone(f, d, type, v, when, f2){
  if(muted) return;
  try{
    ensureAc();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when||0);
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(v||.2, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}

};
const synth = window.speechSynthesis; let voice = null;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices(); let best = null, bs = -1;
  for(const v of vs){
    const l = (v.lang||'').toLowerCase().replace('_','-'), li = ['hr','bs','sr','sl'].findIndex(p => l.startsWith(p));
    if(li < 0) continue;
    const n = (v.name||'').toLowerCase(); let s = (4-li)*100;
    if(/natural|neural|online|premium|enhanced|wavenet/.test(n)) s += 50;
    if(n.includes('google')) s += 30;
    if(s > bs){ bs = s; best = v; }

}

const bufCache = new Map(); window.__miss = [];
async function loadPack(){

    packUrl = 'glas6.mp3?v=' + idx.v; packSize = idx.size; pack = idx.clips;

}
async function clipBytes(s){
  const off = pack[s][0], len = pack[s][1];
  if(probe) await probe;
  if(packBin) return packBin.slice(off, off+len);
  const job = (async () => {
    const r = await fetch(packUrl, {headers:{Range:'bytes='+off+'-'+(off+len-1)}});
    const ab = await r.arrayBuffer();
    if(r.status === 206 && ab.byteLength === len) return ab;
    if(ab.byteLength >= packSize){ packBin = ab; return ab.slice(off, off+len); }
    throw new Error('range');
  })();
  if(!probe) probe = job.then(() => {}, () => {});
  return job;
}
function clipBuf(s){
  if(bufCache.has(s)) return bufCache.get(s);
  const p = clipBytes(s).then(ab => new Promise((res, rej) => ac.decodeAudioData(ab, res, rej)));
  bufCache.set(s, p); p.catch(() => bufCache.delete(s));
  return p;
}
function trimOf(b){
  if(b._t) return b._t;
  const d = b.getChannelData(0), n = d.length, sr = b.sampleRate; let a = 0, e = n-1;
  while(a < n && Math.abs(d[a]) < .012) a++;
  while(e > a && Math.abs(d[e]) < .012) e--;
  const s = Math.max(0, a/sr - .03);
  return b._t = [s, Math.min(b.duration - s, (e-a)/sr + .25)];
}

  return new Promise(res => { const src = ac.createBufferSource(), t = trimOf(b); src.buffer = b; src.connect(ac.destination); src.onended = res; curSrc = src; src.start(0, t[0], t[1]); });

  const u = U();
  for(const m of movers){
    m.x += m.vx*dt; m.y += m.vy*dt;
    if(m.x < 9*u){ m.x = 9*u; m.vx = Math.abs(m.vx); } if(m.x > m.W - 9*u){ m.x = m.W - 9*u; m.vx = -Math.abs(m.vx); }
    if(m.y < 7*u){ m.y = 7*u; m.vy = Math.abs(m.vy); } if(m.y > m.H - 7*u){ m.y = m.H - 7*u; m.vy = -Math.abs(m.vy); }
    m.el.style.transform = 'translate(' + m.x + 'px,' + m.y + 'px) scaleX(' + (m.vx > 0 ? 1 : -1) + ')';
  }
}

/* ---------- 3. odgovori glasom ---------- */
const getSR = () => window.SpeechRecognition || window.webkitSpeechRecognition;
let micOff = !getSR(), rec = null;
const norm = s => ' ' + String(s).toLowerCase().replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z').replace(/đ/g, 'd').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
const NUMK = [['jedan','jedna','jedno','1'],['dva','dvije','dve','2'],['tri','3'],['cetiri','4'],['pet','5'],['sest','6'],['sedam','7'],['osam','8'],['devet','9'],['deset','10']];
const hasRoot = k => t => k.some(r => t.includes(r));
const hasNum = n => t => NUMK[n-1].some(w => t.includes(' ' + w + ' '));
function stopRec(){ if(rec){ try{ rec.onresult = rec.onend = rec.onerror = null; rec.abort(); }catch(e){} rec = null; } const m = $('#mic'); if(m) m.classList.remove('on'); }
function listen(match, ms){
  return new Promise(res => {
    if(micOff) return res('off');
    let r, done = false; try{ r = new (getSR())(); }catch(e){ micOff = true; return res('off'); }
    const fin = v => { if(done) return; done = true; clearTimeout(t); stopRec(); res(v); };
    rec = r; r.lang = 'hr-HR'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
    r.onresult = e => { for(let i = 0; i < e.results.length; i++) for(let j = 0; j < e.results[i].length; j++){ const tr = e.results[i][j].transcript; const h = $('#heard'); if(h) h.textContent = '„' + tr.trim() + '”'; if(match(norm(tr))) return fin('ok'); } };
    r.onerror = e => { if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ micOff = true; fin('off'); } else fin('miss'); };
    r.onend = () => fin('miss');
    const t = setTimeout(() => fin('miss'), ms);
    try{ r.start(); const m = $('#mic'); if(m) m.classList.add('on'); sfx.ping(); }catch(e){ fin('miss'); }
  });
}
function voiceSpec(kind){
  if(kind === 'name'){ const w = stage === 1 || Math.random() < .5 ? dino : pick(DINOS);
    return {pic:dn(w.id, 40), q:T.who, match:hasRoot(w.k), ans:S.name(w), fb:S.click(w), opts:shuffle([w].concat(sample(DINOS, 2, w))), cls:'card', html:x => dn(x.id, 28), right:x => x === w}; }
  if(kind === 'color'){ const c = pick(COLORS);
    return {pic:'<span class="eg" style="--w:19">' + plainEgg(c.hex) + '</span>', q:T.whatColor, match:hasRoot(c.k), ans:S.colSay(c), fb:S.colClick(c), opts:shuffle([c].concat(sample(COLORS, 2, c))), cls:'sw', html:x => '<i style="display:block;width:74%;height:74%;border-radius:50%;background:' + x.hex + '"></i>', right:x => x === c}; }
  const n = rnd(1, Math.min(10, MAXN[stage])), id = pick(DINOS).id;
  return {pic:Array.from({length:n}, () => eg(id, 8.4)).join(''), q:T.howMany, match:hasNum(n), ans:S.numSay(n), fb:S.numClick(n), opts:numOpts(n, 10), cls:'', html:x => x, right:x => x === n};
}
async function startVoice(kind){
  const my = run, v = voiceSpec(kind), b = board(); mode = 'voice'; setHow('voice');
  const pic = el('div', 'pic panel', v.pic); b.appendChild(pic);
  const mic = el('div', '', '<div id="micDot" class="emo">🎤</div><div id="heard"></div><button id="skip" class="emo" aria-label="Odgovori klikom">🖱️</button>'); mic.id = 'mic'; b.appendChild(mic);
  let fell = false;
  const fallback = line => { if(fell || my !== run) return; fell = true; stopRec(); mic.remove(); setHow('mouse'); busy = false;
    options(b, v.opts, v.cls, v.html, v.right, o => solved(v.ans, o)); say(line + ' ' + v.fb); };
  $('#skip').onclick = () => { ensureAc(); fallback(T.byClick); };
  busy = false;
  await Promise.race([say((toldVoice ? '' : T.voice + ' ') + v.q), wait(9000)]); toldVoice = true;
  for(let att = 0; att < 2 && !micOff && !fell && my === run; att++){
    const r = await listen(v.match, 7000);
    if(my !== run || fell) return;
    if(r === 'ok'){ mic.classList.remove('on'); return solved(v.ans, pic); }
    if(r === 'off') break;
    if(att === 0) await Promise.race([say(T.again), wait(6000)]);
  }
  if(my !== run || fell) return;
  const line = micOff && !toldMic ? T.micOff : T.byClick; if(micOff) toldMic = true;
  fallback(line);
}

/* ---------- tijek razine ---------- */
function clearField(){ stopRec(); mode = ''; movers = []; hero = null; field.innerHTML = ''; $('#pad').hidden = true; document.body.classList.remove('run'); }
function nextStep(){
  clearField(); tErr = 0;
  if(step >= steps.length) return win();
  drawPips(); const s = steps[step];
  if(s[0] === 'A') startRun(s[1]);
  else if(s[0] === 'B'){ setHow('mouse'); const line = MOUSE[s[1]](); busy = false; tell(line); }
  else startVoice(s[1]);
}
function startLevel(i){
  ensureAc(); run++; level = i; di = Math.floor(i/3); stage = i % 3; dino = DINOS[di]; step = 0; errors = 0; greeted = true; screen = 'game';
  const pool = PLAN_B[stage], rot = k => pool[(di + k) % pool.length], A = PLAN_A[stage], C = PLAN_C[stage];
  const bs = stage === 1 ? ['feed', rot(0), rot(3)] : [rot(0), rot(2), rot(4)];
  steps = [['A', A[di % A.length]], ['B', bs[0]], ['C', C[di % C.length]], ['B', bs[1]], ['B', bs[2]]];
  intro = S['intro' + stage](dino);
  document.body.className = 's' + stage + ' play';
  $('#map').hidden = true; $('#win').hidden = true; field.hidden = false; $('#prompt').hidden = false; $('#pips').hidden = false; $('#back').hidden = false;
  ['#home','#l1','#l2','#l3','#l4'].forEach(s => $(s).hidden = true);
  sfx.go(); nextStep();
}
function win(){
  const st = errors <= 1 ? 3 : errors <= 4 ? 2 : 1, my = run, id = dino.id; save[level] = Math.max(stars(level), st); store();
  screen = 'win'; clearField(); field.hidden = true; $('#prompt').hidden = true; $('#pips').hidden = true; $('#back').hidden = true;
  const art = $('#wart'); $('#wname').textContent = dino.n; $('#wstars').innerHTML = ''; $('#wnext').hidden = stage === 2; $('#win').hidden = false;
  const done = () => { if(my !== run || screen !== 'win') return; $('#wstars').innerHTML = starHtml(st); sfx.fanfare();
    const all = [...Array(LEVELS).keys()].every(k => stars(k) > 0);
    say(S['win' + stage](dino) + ' ' + dino.facts[stage] + (all && stage === 2 ? ' ' + T.winAll : '')); };
  if(stage === 0){ art.innerHTML = '<div class="wob">' + eg(id, 26) + '</div>'; sfx.crack(); setTimeout(() => { if(my !== run) return; sfx.crack(); }, 600);
    setTimeout(() => { if(my !== run) return; art.innerHTML = '<div class="pop">' + baby(id, 44) + '</div>'; sfx.pop(); done(); }, 1300); }
  else if(stage === 1){ art.innerHTML = '<div>' + baby(id, 30) + '</div>';
    setTimeout(() => { if(my !== run) return; art.innerHTML = '<div class="pop">' + dn(id, 60) + '</div>'; sfx.roar(); done(); }, 1100); }
  else { art.innerHTML = '<div class="pop">' + dn(id, 60) + '</div><span class="crown emo">👑</span>'; sfx.roar(); setTimeout(done, 500); }
}
function showMap(quiet){
  run++; screen = 'map'; busy = true; stopVoice(); clearField(); field.hidden = true;
  document.body.className = 's1';
  $('#map').hidden = false; $('#win').hidden = true; $('#prompt').hidden = true; $('#pips').hidden = true; $('#back').hidden = true;
  ['#home','#l1','#l2','#l3','#l4'].forEach(s => $(s).hidden = false);
  const box = $('#cards'); box.innerHTML = '';
  if(sel < 0 || sel >= DINOS.length) sel = 0;
  DINOS.forEach((d, k) => {
    const p = prog(k), nxt = Math.min(2, p), c = el('div', 'dc panel' + (k === sel ? ' sel' : '') + (p === 3 ? ' champ' : ''));
    c.innerHTML = '<div class="art">' + form(d.id, p, 27) + '</div><div class="nm">' + (p ? d.n : '? ? ?') + '</div><div class="ps"></div>' + (p === 3 ? '<span class="crown emo">👑</span>' : '');
    c.dataset.k = k; c.onclick = () => { ensureAc(); sel = k; startLevel(k*3 + nxt); };
    [0,1,2].forEach(s => { const i = k*3 + s, o = open(i), b = el('button', 'pp emo' + (o ? '' : ' lock') + (stars(i) ? ' done' : '') + (s === p && o ? ' next' : ''), STAGE[s] + (stars(i) ? '<span class="st">' + starHtml(stars(i)) + '</span>' : ''));
      b.setAttribute('aria-label', d.n + ', razina ' + (s+1)); b.onclick = e => { e.stopPropagation(); ensureAc(); sel = k; o ? startLevel(i) : (sfx.nope(), say(T.locked)); }; c.querySelector('.ps').appendChild(b); });
    box.appendChild(c);
  });
  if(!quiet) say(T.menu);
}
$('#wagain').onclick = () => startLevel(level);
$('#wnext').onclick = () => stage < 2 ? startLevel(level+1) : showMap();
$('#wmap').onclick = () => { sel = di; showMap(); };
$('#back').onclick = () => { sel = di; showMap(true); };
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; if(muted) stopVoice(); $('#mute').blur(); };
addEventListener('pointerdown', e => { if(!greeted && screen === 'map' && !e.target.closest('.dc,a,button')){ greeted = true; ensureAc(); say(T.hi); } });

/* tipke: strelice vode dinosaura; na karti biraju karticu */
const KEY = {ArrowLeft:'l', ArrowRight:'r', ArrowUp:'u', ArrowDown:'d', KeyA:'l', KeyD:'r', KeyW:'u', KeyS:'d'};
function padLight(){ document.querySelectorAll('#pad button').forEach(b => b.classList.toggle('on', !!keys[b.dataset.k])); }
addEventListener('keydown', e => {
  const k = e.code, d = KEY[k];
  if(k === 'Space' || k.startsWith('Arrow')) e.preventDefault();
  if(screen === 'game'){
    if(k === 'Escape'){ sel = di; showMap(true); return; }
    if(d){ keys[d] = true; padLight(); ensureAc(); }
  } else if(screen === 'map'){
    if(e.repeat) return;
    const N = DINOS.length;
    if(d){ sel = d === 'l' ? Math.max(0, sel-1) : d === 'r' ? Math.min(N-1, sel+1) : d === 'u' ? (sel >= 5 ? sel-5 : sel) : (sel < 5 ? sel+5 : sel);
      document.querySelectorAll('.dc').forEach(n => n.classList.toggle('sel', +n.dataset.k === sel));
      if(!greeted){ greeted = true; ensureAc(); say(T.hi); } }
    else if(k === 'Enter' || k === 'Space'){ const n = document.querySelector('.dc.sel'); if(n) n.click(); }
  } else if(screen === 'win'){
    if(e.repeat) return;
    if(k === 'Enter' || k === 'Space') stage < 2 ? startLevel(level+1) : showMap(); else if(k === 'Escape') showMap(true);
  }
});
addEventListener('keyup', e => { const d = KEY[e.code]; if(d){ keys[d] = false; padLight(); } });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; padLight(); });
document.querySelectorAll('#pad button').forEach(b => {
  const on = v => e => { e.preventDefault(); keys[b.dataset.k] = v; padLight(); ensureAc(); };
  b.addEventListener('pointerdown', on(true)); ['pointerup','pointerleave','pointercancel'].forEach(n => b.addEventListener(n, on(false)));
});
let lastT = 0;
function frame(t){
  const dt = Math.min(.05, (t - lastT)/1000 || 0); lastT = t;
  if(mode === 'run' && hero) stepRun(dt); else if(mode === 'swim') stepSwim(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

loadPack().then(() => { $('#loading').textContent = ''; });
setTimeout(() => { $('#loading').textContent = ''; }, 8000);
showMap(true);
</script>
