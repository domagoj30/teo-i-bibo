<!doctype html>
<html lang="hr">
<head>

<style>
html,body{margin:0; height:100%; overflow:hidden; background:#8fd3ff; font-family:system-ui,"Segoe UI",Roboto,sans-serif; color:#1b2340; user-select:none}
[hidden]{display:none!important}
canvas{display:block; width:100vw; height:100vh}
.screen{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; text-align:center;
  background:linear-gradient(#7cc8ff,#c9ecff 60%,#ffe9b8)}
h1{margin:0; font-size:clamp(30px,12vh,96px); font-weight:800; line-height:1; color:#1b2340; text-shadow:0 .5vh 0 #fff}
h1 b{color:#ff8a1f}
#levels{display:flex; gap:2.4vh; flex-wrap:wrap; justify-content:center}
.lvl{width:21vh; height:23vh; min-width:92px; min-height:100px; border:0; border-radius:3.5vh; background:#fff; cursor:pointer; font:inherit; color:inherit;

.lvl .ic{font-size:9vh; line-height:1}

.lvl .kr{font-size:2.4vh; letter-spacing:.2vh}
.lvl .kr i{font-style:normal; opacity:.22; filter:grayscale(1)}

#win h2{margin:0; font-size:11vh}
#win .row{font-size:7vh; font-weight:800}

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const appr = (v,t,d) => v < t ? Math.min(t, v+d) : Math.max(t, v-d);
const NAME = 'Teo';

/* ---------- Bibine recenice (sve se snimaju: alat\glas.py pustolovina) ---------- */
/*@LINES*/
const T = {
  hi:'Bok, ' + NAME + '! Idemo u pustolovinu! Trči strelicama.',
  jump:'Skoči razmaknicom!',
  slime:'Pazi, ljigavac! Skoči na njega ili se zavrti tipkom X.',
  dbl:'Za veliki skok pritisni razmaknicu dvaput!',
  wait:'Pričekaj ploču pa skoči na nju!',
  crate:'Kutije razbij vrtnjom!',
  spring:'Skoči na oprugu!',
  cp:'Zastavica! Odavde nastavljamo.',
  k1:'Kristal! Bravo!', k2:'Još jedan kristal!', k3:'Imaš sva tri kristala! Svaka čast!',
  beach:'Ovo je pješčana plaža. Pazi, neke ploče padaju!',
  roll:'Bodljikavu kuglu ne možeš pobijediti. Preskoči je!',
  lift:'Ova ploča ide gore i dolje. Stani na nju!',
  ice:'Brrr, ledeni vrh! Led je sklizak, idi polako.',
  lava:'Ovo je vulkan! Ne padaj u lavu.',
  space:'Svemirska postaja! Ovdje se skače jako visoko.',
  boss:'Ajme, Veliki Ljigavac! Skoči mu na glavu tri puta!',
  bosshit:'Tako je! Još jednom!',
  bossdead:'Pobijedio si Velikog Ljigavca! Raketa nas čeka!',
  all:'Prešao si sve staze! Ti si prvak svemira!',
  menu:'Odaberi stazu!'
};
const OUCH = ['Ups! Idemo opet!', 'Ništa strašno. Probaj ponovno!', 'Skoro! Još jednom!'];
const WIN = ['Bravo, ' + NAME + '! Stigli smo do rakete!', 'Odlično, ' + NAME + '! Prešao si cijelu stazu!', NAME + ', ti si pravi junak!'];
function allLines(){ return Object.values(T).concat(OUCH, WIN); }
/*@END*/

/* ---------- zvuk i glas ---------- */
let ac = null, muted = false, SIM = false;
function ensureAc(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state === 'suspended') ac.resume(); }catch(e){} return ac; }
function tone(f, d, type, v, when, f2){
  if(muted || SIM) return;
  try{
    ensureAc();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when||0);
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(v||.2, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
const sfx = {
  jump(){ tone(300,.2,'sine',.16,0,760); },
  jump2(){ tone(480,.22,'triangle',.16,0,1100); },
  coin(){ tone(988,.07,'square',.07); tone(1319,.16,'square',.07,.07); },
  stomp(){ tone(220,.16,'square',.14,0,70); },
  spin(){ tone(240,.3,'sawtooth',.06,0,900); },
  spring(){ tone(180,.35,'triangle',.22,0,1300); },
  oops(){ tone(320,.35,'sine',.2,0,120); },
  cp(){ tone(660,.12,'triangle',.2); tone(880,.2,'triangle',.2,.12); },
  crystal(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.2,'sine',.2,i*.08)); },
  crate(){ tone(140,.18,'square',.16,0,60); },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.22,i*.14)); },
  rocket(){ tone(120,1.8,'sawtooth',.1,0,900); }
};
const synth = window.speechSynthesis; let voice = null;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices(); let best = null, bs = -1;
  for(const v of vs){
    const l = (v.lang||'').toLowerCase().replace('_','-'), li = ['hr','bs','sr','sl'].findIndex(p => l.startsWith(p));
    if(li < 0) continue;
    const n = (v.name||'').toLowerCase(); let s = (4-li)*100;
    if(/natural|neural|online|premium|enhanced|wavenet/.test(n)) s += 50;
    if(n.includes('google')) s += 30;
    if(s > bs){ bs = s; best = v; }
  }
  voice = best;
}
if(synth){ pickVoice(); try{ synth.addEventListener('voiceschanged', pickVoice); }catch(e){} }
const SPLIT = /(?<=[.!?])\s+/, bubble = $('#bubble');
let pack = null, packBin = null, curSrc = null, packUrl = '', packSize = 0, probe = null, sayId = 0, bubbleT = 0;
const bufCache = new Map(); window.__miss = [];
async function loadPack(){
  try{
    const idx = await (await fetch('glas2.json', {cache:'no-cache'})).json();
    packUrl = 'glas2.mp3?v=' + idx.v; packSize = idx.size; pack = idx.clips;
  }catch(e){ pack = null; }
}
async function clipBytes(s){
  const off = pack[s][0], len = pack[s][1];
  if(probe) await probe;
  if(packBin) return packBin.slice(off, off+len);
  const job = (async () => {
    const r = await fetch(packUrl, {headers:{Range:'bytes='+off+'-'+(off+len-1)}});
    const ab = await r.arrayBuffer();
    if(r.status === 206 && ab.byteLength === len) return ab;
    if(ab.byteLength >= packSize){ packBin = ab; return ab.slice(off, off+len); }
    throw new Error('range');
  })();
  if(!probe) probe = job.then(() => {}, () => {});
  return job;
}
function clipBuf(s){
  if(bufCache.has(s)) return bufCache.get(s);
  const p = clipBytes(s).then(ab => new Promise((res, rej) => ac.decodeAudioData(ab, res, rej)));
  bufCache.set(s, p); p.catch(() => bufCache.delete(s));
  return p;
}
function trimOf(b){
  if(b._t) return b._t;
  const d = b.getChannelData(0), n = d.length, sr = b.sampleRate; let a = 0, e = n-1;
  while(a < n && Math.abs(d[a]) < .012) a++;
  while(e > a && Math.abs(d[e]) < .012) e--;
  const s = Math.max(0, a/sr - .03);
  return b._t = [s, Math.min(b.duration - s, (e-a)/sr + .25)];
}
function playBuf(b){
  return new Promise(res => { const src = ac.createBufferSource(), t = trimOf(b); src.buffer = b; src.connect(ac.destination); src.onended = res; curSrc = src; src.start(0, t[0], t[1]); });
}
function stopVoice(){
  if(curSrc){ try{ curSrc.onended = null; curSrc.stop(); }catch(e){} curSrc = null; }
  if(synth){ try{ synth.cancel(); }catch(e){} }
}
function speakTTS(s){
  return new Promise(res => {
    const ms = 700 + s.length*65;
    if(voice && synth){
      try{ const u = new SpeechSynthesisUtterance(s); u.voice = voice; u.lang = voice.lang; u.pitch = 1.08; u.rate = .9; u.onend = u.onerror = res; synth.speak(u); }catch(e){}
      setTimeout(res, ms + 4000);
    } else setTimeout(res, ms);
  });
}
function say(text){
  if(SIM) return;
  bubble.textContent = text; bubble.hidden = false; bubbleT = 1.2 + text.length*.075;
  stopVoice();
  const id = ++sayId;
  if(muted) return;
  (async () => {
    const parts = text.split(SPLIT);
    if(pack && ensureAc()) parts.forEach(s => { if(pack[s]) clipBuf(s).catch(() => {}); });
    for(const s of parts){
      if(id !== sayId) return;
      if(pack && pack[s] && ensureAc()){
        try{ const b = await clipBuf(s); if(id !== sayId) return; await playBuf(b); continue; }catch(e){}
      } else if(pack) window.__miss.push(s);
      if(id !== sayId) return;
      await speakTTS(s);
    }
  })();
}

/* ---------- scena ---------- */
const renderer = new THREE.WebGLRenderer({canvas:$('#c'), antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(52, 1, .1, 260);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a8, .7));
const sun = new THREE.DirectionalLight(0xffffff, .5); sun.position.set(4,10,6); scene.add(sun);
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const L = (c,o) => new THREE.MeshLambertMaterial(Object.assign({color:c}, o||{}));
const GLOW = c => new THREE.MeshBasicMaterial({color:c});
const SPH = new THREE.SphereGeometry(1,18,14), BOX = new THREE.BoxGeometry(1,1,1);
function mesh(g, m, x,y,z, parent){ const o = new THREE.Mesh(g,m); o.position.set(x,y,z); (parent||scene).add(o); return o; }

/* ---------- Bibo ---------- */
const WHITE = L(0xffffff), ORANGE = L(0xff8a1f), DARK = L(0x18203f);
const bot = new THREE.Group(); scene.add(bot); bot.scale.setScalar(.5);
{ const b = mesh(SPH, WHITE, 0,.95,0, bot); b.scale.set(.5,.55,.45);
  const ch = mesh(SPH, GLOW(0x4de8ff), 0,1.0,.42, bot); ch.scale.set(.1,.1,.05);
  const sc = mesh(new THREE.TorusGeometry(.32,.09,8,20), ORANGE, 0,1.42,0, bot); sc.rotation.x = Math.PI/2; }
const head = new THREE.Group(); head.position.set(0,1.85,0); bot.add(head);
{ const s = mesh(SPH, WHITE, 0,0,0, head); s.scale.set(.58,.48,.5);
  const v = mesh(SPH, DARK, 0,0,.2, head); v.scale.set(.44,.3,.33);
  [-1,1].forEach(k => { const e = mesh(SPH, GLOW(0x4de8ff), k*.16,.01,.5, head); e.scale.set(.075,.1,.04);
    const ear = mesh(new THREE.CylinderGeometry(.14,.14,.12,14), ORANGE, k*.6,0,0, head); ear.rotation.z = Math.PI/2; });
  mesh(new THREE.CylinderGeometry(.025,.025,.35,6), L(0x8891aa), 0,.62,0, head);
  const a = mesh(SPH, GLOW(0xff8a1f), 0,.84,0, head); a.scale.setScalar(.1); }
const arms = [-1,1].map(s => { const p = new THREE.Group(); p.position.set(s*.5,1.25,0); bot.add(p);
  mesh(new THREE.CylinderGeometry(.08,.08,.45,8), WHITE, 0,-.22,0, p); const h = mesh(SPH, ORANGE, 0,-.52,0, p); h.scale.setScalar(.13); p.userData.s = s; return p; });
const legs = [-1,1].map(s => { const p = new THREE.Group(); p.position.set(s*.2,.48,0); bot.add(p);
  mesh(new THREE.CylinderGeometry(.09,.09,.3,8), WHITE, 0,-.18,0, p); const f = mesh(SPH, ORANGE, 0,-.38,.06, p); f.scale.set(.15,.1,.22); return p; });
const ring = mesh(new THREE.TorusGeometry(1.5,.12,6,24), new THREE.MeshBasicMaterial({color:0xffc928, transparent:true, opacity:.7}), 0,1.1,0, bot); ring.rotation.x = Math.PI/2; ring.visible = false;
const shadow = mesh(new THREE.CircleGeometry(.42,20), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.3, depthWrite:false}), 0,0,0); shadow.rotation.x = -Math.PI/2;

/* cestice */
const parts = [];
for(let i=0;i<36;i++){ const m = mesh(SPH, new THREE.MeshBasicMaterial({color:0xffffff}), 0,-99,0); m.scale.setScalar(.12); m.visible = false; parts.push({m, life:0, vx:0, vy:0, vz:0}); }
let partI = 0;
function puff(x,y,z,color,n){
  if(SIM) return;
  for(let i=0;i<n;i++){ const p = parts[partI++ % parts.length]; p.m.material.color.setHex(color); p.m.position.set(x,y,z); p.m.visible = true; p.life = .5; p.vx = rnd(-3,3); p.vy = rnd(1,5); p.vz = rnd(-3,3); }
}

/* ---------- teme ---------- */
const THEMES = {
  grass:{sky:0x8fd3ff, top:0x5cc84e, side:0x9a6a44, water:0x2f8fe0, waterY:-3, deco:'tree'},
  sand:{sky:0xffdf9e, top:0xf4d67c, side:0xd29a4c, water:0x22b8cc, waterY:-3, deco:'palm'},
  ice:{sky:0xcfeaff, top:0xffffff, side:0x8fb8e8, water:0x3b6fb8, waterY:-3, deco:'pine'},
  lava:{sky:0x3a1420, top:0x6a6470, side:0x35313c, water:0xff5a1f, waterY:-3, deco:'rock', hot:true},
  space:{sky:0x0b1030, top:0x9aa3c8, side:0x4a4f78, water:0, waterY:-200, deco:'lamp', stars:true}
};
const MATS = {};
function tmat(c){ return MATS[c] || (MATS[c] = L(c)); }
const waterM = new THREE.MeshBasicMaterial({color:0x2f8fe0, transparent:true, opacity:.85});
const water = mesh(new THREE.PlaneGeometry(500,500), waterM, 0,-3,0); water.rotation.x = -Math.PI/2;
const stars = (function(){ const pos = []; for(let i=0;i<500;i++) pos.push(rnd(-120,120), rnd(-40,70), rnd(-160,40));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({color:0xffffff, size:.5, fog:false})); scene.add(p); return p; })();

/* dijeljene geometrije */
const COING = new THREE.CylinderGeometry(.34,.34,.08,16).rotateX(Math.PI/2), COINM = L(0xffc928,{emissive:0x996000});
const CRYG = new THREE.OctahedronGeometry(.5), CRYM = L(0x4de8ff,{emissive:0x1aa0c0});
const CONE = new THREE.ConeGeometry(1,1,10), CYL = new THREE.CylinderGeometry(1,1,1,12);

/* ---------- razina ---------- */
const STEP = 1/60, HW = .32, SUP = .28, PH = 1.25, SPEED = 6.2, JUMP = 11.5, JUMP2 = 10, STEPUP = .32;
let lv = null, state = 'menu', curLevel = 0, coins = 0, crystals = 0, winT = 0;
const P = {x:0,y:0,z:0, vx:0,vy:0,vz:0, ground:null, face:Math.PI, coyote:0, buf:0, jumps:0, spin:0, spinCd:0, spinReq:false, sprung:false, sprungFrom:null, deadT:0, inv:0, gy:0, run:0};
const K = {left:false,right:false,up:false,down:false,jump:false};
let simLog = [];

function place(b){ b.m.position.set(b.x, b.y - b.h/2, b.z); }
function build(i){
  if(lv) scene.remove(lv.g);
  const def = DEF[i], th = THEMES[def.theme];
  lv = {i, th, def, g:new THREE.Group(), boxes:[], coins:[], en:[], springs:[], crystals:[], cps:[], says:[], way:[], goal:null, boss:null, t:0, G:def.g||30, cp:null, total:0};
  scene.add(lv.g);
  scene.background = new THREE.Color(th.sky); scene.fog = new THREE.Fog(th.sky, 34, 110);
  water.visible = !th.stars; waterM.color.setHex(th.water); water.position.y = th.waterY; stars.visible = !!th.stars;
  const side = tmat(th.side), top = tmat(th.top), iceM = tmat(0x9fe4ff), mvM = tmat(0xffc23d), fallM = tmat(0xff8f6b), crateM = tmat(0xb9793d);
  const api = {
    P(x,y,d,w,len,o){ o = o||{};
      const b = {x, y, z:-d, w, d:len, h:o.h || (o.mv||o.fall ? .6 : 44), bx:x, by:y, bz:-d, dx:0, dy:0, dz:0, mv:o.mv||null, fall:o.fall ? {s:0,t:0,v:0} : null, ice:!!o.ice, side:!!o.side, crate:!!o.crate, off:false};
      const t = o.crate ? crateM : o.ice ? iceM : o.mv ? mvM : o.fall ? fallM : top, s = o.crate ? crateM : (o.mv||o.fall) ? t : side;
      b.m = new THREE.Mesh(BOX, [s,s,t,s,s,s]); b.m.scale.set(w,b.h,len); lv.g.add(b.m); place(b);
      lv.boxes.push(b); if(!b.side && !b.crate) lv.way.push(b); return b; },
    M(x,y,d,ax,a,sp,ph){ return api.P(x,y,d,3.6,3.6,{mv:{ax, a, sp:sp||1.1, ph:ph||0}}); },
    F(x,y,d){ return api.P(x,y,d,2.6,2.6,{fall:1}); },
    X(x,y,d){ return api.P(x,y+1.3,d,1.3,1.3,{crate:1, h:1.3}); },
    E(x,y,d,ax,a,type){
      const e = {x, y, z:-d, bx:x, by:y, bz:-d, ax:ax||'x', a:a||0, sp:1.3, ph:rnd(0,6), type:type||'blob', r:.55, eh:.9, dead:false, hp:1, inv:0};
      const g = new THREE.Group();
      if(e.type === 'roll'){
        mesh(SPH, tmat(0x3a2a55), 0,.55,0, g).scale.setScalar(.5);
        for(let k=0;k<12;k++){ const c = mesh(CONE, tmat(0xff4d4d), 0,.55,0, g); c.scale.set(.14,.36,.14);

    CP(x,y,d){ const g = new THREE.Group(); mesh(CYL, tmat(0xdddddd), 0,1,0, g).scale.set(.06,2,.06);

  }
  if(lv.boss && lv.goal) lv.goal.m.visible = false;
}

/* ---------- fizika ---------- */
function ovl(b, x, z, hw){ return Math.abs(x-b.x) < b.w/2+hw && Math.abs(z-b.z) < b.d/2+hw; }
function updBox(b, dt){
  if(b.mv){
    const v = b.mv.a*Math.sin(lv.t*b.mv.sp + b.mv.ph), ox = b.x, oy = b.y, oz = b.z;
    if(b.mv.ax === 'x') b.x = b.bx+v; else if(b.mv.ax === 'y') b.y = b.by+v; else b.z = b.bz+v;
    b.dx = b.x-ox; b.dy = b.y-oy; b.dz = b.z-oz; place(b);
  } else if(b.fall){
    const f = b.fall;
    if(f.s === 0){ if(P.ground === b){ f.s = 1; f.t = 0; } }
    else { f.t += dt;
      if(f.s === 1){ b.m.position.x = b.x + Math.sin(f.t*60)*.05; if(f.t > .6){ f.s = 2; f.v = 0; } }
      else if(f.s === 2){ f.v -= 25*dt; const oy = b.y; b.y += f.v*dt; b.dy = b.y-oy; place(b);
        if(f.t > 1.7){ b.off = true; b.m.visible = false; b.dy = 0; if(P.ground === b) P.ground = null; f.s = 3; } }
      else if(f.t > 4.2){ f.s = 0; b.y = b.by; b.off = false; b.m.visible = true; place(b); } }
  }
}
function collideH(ax){
  for(const b of lv.boxes){
    if(b.off || !ovl(b,P.x,P.z,HW)) continue;
    if(P.y >= b.y - 1e-3 || P.y + PH <= b.y - b.h) continue;
    if(b.y - P.y <= STEPUP && ovl(b,P.x,P.z,SUP)){ P.y = b.y; if(P.vy < 0) P.vy = 0; continue; }
    if(ax === 'x'){ P.x = P.x < b.x ? b.x - b.w/2 - HW : b.x + b.w/2 + HW; P.vx = 0; }
    else { P.z = P.z < b.z ? b.z - b.d/2 - HW : b.z + b.d/2 + HW; P.vz = 0; }
  }
}
function stepPlayer(dt){
  let ix = (K.right?1:0) - (K.left?1:0), iz = (K.down?1:0) - (K.up?1:0);
  const il = Math.hypot(ix,iz); if(il > 1){ ix /= il; iz /= il; }
  const acc = P.ground ? (P.ground.ice ? 7 : 60) : 28;
  P.vx = appr(P.vx, ix*SPEED, acc*dt); P.vz = appr(P.vz, iz*SPEED, acc*dt);
  if(il > 0) P.face = Math.atan2(ix, iz);
  if(P.ground){ if(P.ground.off){ P.ground = null; } else { P.x += P.ground.dx; P.z += P.ground.dz; P.y = P.ground.y; } }
  if(P.ground) P.coyote = .12; else { if(P.coyote > 0 && P.coyote - dt <= 0 && P.jumps === 0) P.jumps = 1; P.coyote -= dt; }
  P.buf -= dt;
  if(P.buf > 0){
    if(P.coyote > 0){ P.vy = JUMP; P.ground = null; P.coyote = 0; P.buf = 0; P.jumps = 1; P.sprung = false; sfx.jump(); }
    else if(P.jumps < 2){ P.vy = JUMP2; P.jumps = 2; P.buf = 0; P.sprung = false; P.flip = .4; sfx.jump2(); puff(P.x,P.y,P.z,0xffffff,6); }
  }
  if(!K.jump && P.vy > 4 && !P.sprung) P.vy -= 40*dt;
  P.vy = Math.max(-30, P.vy - lv.G*dt);
  if(P.spinReq && P.spinCd <= 0){ P.spin = .45; P.spinCd = .65; sfx.spin(); }
  P.spinReq = false; P.spin -= dt; P.spinCd -= dt; P.inv -= dt;
  P.x += P.vx*dt; collideH('x');
  P.z += P.vz*dt; collideH('z');
  const py = P.y; P.y += P.vy*dt; P.ground = null;
  let land = null;
  for(const b of lv.boxes){
    if(b.off || !ovl(b,P.x,P.z,SUP)) continue;
    if(P.vy <= 0){ if(py >= b.y - .06 - Math.max(0,b.dy) && P.y <= b.y && (!land || b.y > land.y)) land = b; }
    else if(py + PH <= b.y - b.h + .05 && P.y + PH > b.y - b.h){ P.y = b.y - b.h - PH; P.vy = 0; }
  }
  if(land){ P.y = land.y; P.vy = 0; P.ground = land; P.jumps = 0; P.sprung = false; P.gy = land.y; }
  for(const s of lv.springs){
    if(P.vy <= 0 && Math.hypot(P.x-s.x, P.z-s.z) < .9 && P.y <= s.y + .45 && P.y >= s.y - .3){
      P.vy = s.pow; P.ground = null; P.jumps = 1; P.sprung = true; P.sprungFrom = s; P.coyote = 0; s.sq = .3; sfx.spring();
    }
  }
  if(P.spin > 0){
    for(const b of lv.boxes){ if(b.crate && !b.off && Math.hypot(b.x-P.x, b.z-P.z) < 1.8 && Math.abs(b.y - .65 - (P.y+.6)) < 1.6){
      b.off = true; b.m.visible = false; coins += 3; sfx.crate(); sfx.coin(); puff(b.x,b.y,b.z,0xffc928,10); hud(); } }
  }
}
function hurt(why){
  if(P.deadT > 0 || P.inv > 0) return;
  simLog.push(why + '@' + Math.round(-P.z));
  P.deadT = SIM ? .01 : .7; sfx.oops(); puff(P.x,P.y+.6,P.z,0xff8a1f,12);
  if(!SIM){ $('#fade').style.opacity = 1; if(Math.random() < .5) say(OUCH[Math.floor(rnd(0,OUCH.length))]); }
}
function respawn(){
  const c = lv.cp; P.x = c.x; P.y = c.y + .05; P.z = c.z; P.vx = P.vy = P.vz = 0; P.ground = null; P.inv = 1.2; P.gy = c.y; P.face = Math.PI; P.jumps = 0;
  if(lv.boss && !lv.boss.dead){ const e = lv.boss; e.x = e.bx; e.z = e.bz; }
  if(!SIM) $('#fade').style.opacity = 0;
}
function updEnemies(dt){
  for(const e of lv.en){
    if(e.dead) continue;
    e.inv -= dt;
    if(e.type === 'boss'){
      const dx = P.x - e.x, dz = P.z - e.z, d = Math.hypot(dx,dz) || 1, far = Math.abs(P.y - e.y) < 6 && P.z < e.box.z + e.box.d/2 + 1;
      if(far && e.inv <= 0){ e.x += dx/d*e.sp*dt; e.z += dz/d*e.sp*dt; }
      e.x = clamp(e.x, e.box.x - e.box.w/2 + 1.6, e.box.x + e.box.w/2 - 1.6); e.z = clamp(e.z, e.box.z - e.box.d/2 + 1.6, e.box.z + e.box.d/2 - 1.6);
      e.yy = e.y; e.m.visible = e.inv <= 0 || Math.floor(lv.t*14)%2 === 0;
    } else {
      const v = e.a*Math.sin(lv.t*e.sp + e.ph);
      if(e.ax === 'x') e.x = e.bx + v; else e.z = e.bz + v;
      e.yy = e.type === 'jump' ? e.y + Math.abs(Math.sin(lv.t*2.4 + e.ph))*1.7 : e.y;
    }
    e.m.position.set(e.x, e.yy, e.z);
    if(e.type === 'roll') e.m.rotation.z = -e.x*1.6; else e.m.scale.y = (e.type === 'boss' ? 2.6 : 1) * (1 + Math.sin(lv.t*6 + e.ph)*.08);
    if(P.deadT > 0) continue;
    if(Math.hypot(P.x-e.x, P.z-e.z) > e.r + .3 || P.y > e.yy + e.eh || P.y + PH < e.yy) continue;
    if(e.type === 'roll'){ hurt('kugla'); continue; }
    if(e.inv > 0) continue;
    const stomp = P.vy < 0 && P.y > e.yy + e.eh*.4;
    if(stomp || P.spin > 0){
      if(stomp){ P.vy = 9.5; P.jumps = 1; P.sprung = true; } else if(e.type === 'boss'){ const dx = P.x-e.x, dz = P.z-e.z, d = Math.hypot(dx,dz)||1; P.vx = dx/d*9; P.vz = dz/d*9; P.vy = 6; P.ground = null; }
      e.hp--; sfx.stomp(); puff(e.x, e.yy+.5, e.z, 0xc58bff, 10);
      if(e.hp <= 0){ e.dead = true; e.m.visible = false; coins += e.type === 'boss' ? 10 : 1; sfx.coin(); hud();
        if(e.type === 'boss'){ lv.goal.m.visible = true; sfx.fanfare(); say(T.bossdead); } }
      else { e.inv = 1.3; e.sp += .9; say(T.bosshit); }
    } else hurt(e.type === 'boss' ? 'boss' : 'ljigavac');
  }
}
function pickups(dt){
  const cy = P.y + .6;
  for(const c of lv.coins){ if(!c.got && Math.abs(c.x-P.x) < 1 && Math.abs(c.z-P.z) < 1 && Math.abs(c.y-cy) < 1.1){ c.got = true; c.m.visible = false; coins++; sfx.coin(); hud(); } }
  for(const c of lv.crystals){ if(!c.got && Math.hypot(c.x-P.x, c.y-cy, c.z-P.z) < 1.35){ c.got = true; c.m.visible = false; crystals++; sfx.crystal(); puff(c.x,c.y,c.z,0x4de8ff,14); hud(); say(crystals === 3 ? T.k3 : crystals === 2 ? T.k2 : T.k1); } }
  for(const c of lv.cps){ if(!c.on && Math.hypot(c.x-P.x, c.z-P.z) < 2 && Math.abs(c.y-P.y) < 1.5){ c.on = true; c.fm.color.setHex(0xff8a1f); lv.cp = c; sfx.cp(); say(T.cp); } }
  const d = -P.z;
  for(const s of lv.says){ if(!s.done && d > s.d){ s.done = true; say(s.text); } }
  const g = lv.goal;
  if(g && g.m.visible && Math.hypot(g.x-P.x, g.z-P.z) < 1.7 && Math.abs(g.y-P.y) < 2.5){ state = 'win'; winT = 0; if(!SIM){ sfx.fanfare(); sfx.rocket(); say(lv.i === DEF.length-1 ? T.all : WIN[Math.floor(rnd(0,WIN.length))]); } }
}
function update(dt){
  if(state === 'win'){ winT += dt; lv.goal.m.position.y += dt*(1 + winT*5); if(winT > 2.4 && !SIM) showWin(); return; }
  if(state !== 'play') return;
  lv.t += dt;
  for(const b of lv.boxes) updBox(b, dt);
  if(P.deadT > 0){ P.deadT -= dt; updEnemies(dt); if(P.deadT <= 0) respawn(); return; }
  stepPlayer(dt); updEnemies(dt); pickups(dt);
  if(P.y < Math.max(lv.th.waterY - .4, P.gy - 11)) hurt('pad');
}

/* ---------- crtanje ---------- */
let camY = 0, faceA = Math.PI, spinA = 0;
function draw(dt){
  for(const p of parts){ if(p.life > 0){ p.life -= dt; p.vy -= 12*dt; p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt; p.m.position.z += p.vz*dt; if(p.life <= 0) p.m.visible = false; } }
  if(bubbleT > 0){ bubbleT -= dt; if(bubbleT <= 0) bubble.hidden = true; }
  if(!lv) return;
  const t = lv.t;
  for(const c of lv.coins) if(!c.got) c.m.rotation.y = t*3 + c.z;
  for(const c of lv.crystals) if(!c.got){ c.m.rotation.y = t*2; c.m.position.y = c.y + Math.sin(t*2 + c.z)*.15; }
  for(const s of lv.springs){ s.sq = Math.max(0, s.sq - dt); s.top.position.y = .32 + s.sq*1.6; }
  /* Bibo */
  let da = P.face - faceA; while(da > Math.PI) da -= 2*Math.PI; while(da < -Math.PI) da += 2*Math.PI; faceA += da*Math.min(1, dt*14);
  if(P.spin > 0 || (P.flip > 0)){ spinA += dt*26; } else spinA = 0;
  if(P.flip > 0) P.flip -= dt;
  bot.visible = state !== 'win' && !(P.deadT > 0) && !(P.inv > 0 && Math.floor(t*14)%2 === 0);
  bot.position.set(P.x, P.y, P.z); bot.rotation.y = faceA + spinA;
  ring.visible = P.spin > 0;
  const sp = Math.hypot(P.vx,P.vz), air = !P.ground;
  P.run += dt*sp*2.4;
  const sw = air ? .5 : Math.sin(P.run)*Math.min(1, sp/3)*.9;
  legs[0].rotation.x = sw; legs[1].rotation.x = air ? -.5 : -sw;
  arms.forEach(a => { a.rotation.x = P.spin > 0 ? 0 : air ? -2.6 : -sw*a.userData.s; a.rotation.z = P.spin > 0 ? a.userData.s*1.4 : 0; });
  head.position.y = 1.85 + (air ? .04 : Math.abs(Math.sin(P.run))*.04);
  /* sjena na tlu ispod */
  let top = -1e9;
  for(const b of lv.boxes){ if(!b.off && b.y <= P.y + .1 && b.y > top && ovl(b,P.x,P.z,0)) top = b.y; }
  shadow.visible = top > -1e8 && bot.visible; shadow.position.set(P.x, top + .03, P.z);
  const sc = clamp(1 - (P.y - top)*.08, .45, 1); shadow.scale.setScalar(sc);
  /* kamera */
  const ty = Math.max(P.gy, P.y - 3.5);
  camY += (ty - camY)*Math.min(1, dt*4);
  camera.position.set(P.x*.8, camY + 5.4, P.z + 9.2);
  camera.lookAt(P.x*.8, camY + 1.2, P.z - 2.5);
  water.position.z = P.z; stars.position.z = P.z;
}

/* ---------- tijek igre ---------- */
let save = {open:1, best:[]};
try{ const s = JSON.parse(localStorage.getItem('bibo2')); if(s && s.open) save = s; }catch(e){}
if(/[?&]sve/.test(location.search)) save.open = DEF.length;
function store(){ try{ localStorage.setItem('bibo2', JSON.stringify(save)); }catch(e){} }
function hud(){
  if(SIM) return;
  $('#co').textContent = '🪙 ' + coins;
  document.querySelectorAll('#kr i').forEach((e,i) => e.classList.toggle('on', i < crystals));
}
let titleT = 0;
function startLevel(i){
  curLevel = i; build(i); coins = 0; crystals = 0;
  Object.assign(P, {x:0, y:.05, z:3, vx:0, vy:0, vz:0, ground:null, face:Math.PI, jumps:0, spin:0, spinCd:0, deadT:0, inv:0, gy:0, buf:0, coyote:0, sprung:false, sprungFrom:null, flip:0});
  lv.cp = {x:0, y:0, z:3}; camY = 0; faceA = Math.PI; state = 'play';
  K.left = K.right = K.up = K.down = K.jump = false;
  if(SIM) return;
  $('#menu').hidden = true; $('#win').hidden = true; $('#hud').hidden = false; $('#back').hidden = false; $('#fade').style.opacity = 0;
  $('#title').textContent = DEF[i].icon + ' ' + DEF[i].name; $('#title').hidden = false; titleT = 2.5; hud();
}
function showWin(){
  state = 'panel';
  const b = save.best[curLevel] || {c:0, k:0};
  save.best[curLevel] = {c:Math.max(b.c, coins), k:Math.max(b.k, crystals)};
  save.open = Math.max(save.open, Math.min(DEF.length, curLevel + 2)); store();
  $('#winrow').textContent = '🪙 ' + coins + '   ' + '💎'.repeat(crystals) + '▫️'.repeat(3 - crystals);
  $('#next').hidden = curLevel >= DEF.length - 1;
  $('#win').hidden = false; $('#hud').hidden = true; $('#back').hidden = true;
}
let sel = 0;
function showMenu(){
  state = 'menu'; stopVoice(); bubble.hidden = true;
  $('#menu').hidden = false; $('#win').hidden = true; $('#hud').hidden = true; $('#back').hidden = true; $('#title').hidden = true;
  const box = $('#levels'); box.innerHTML = '';
  sel = Math.min(save.open, DEF.length) - 1;
  DEF.forEach((d,i) => {
    const b = document.createElement('button'), k = (save.best[i]||{}).k || 0, open = i < save.open;
    b.className = 'lvl' + (open ? '' : ' lock') + (i === sel ? ' sel' : ''); b.setAttribute('aria-label', d.name);
    b.innerHTML = '<span class="ic">' + d.icon + '</span><span class="nm">' + (i+1) + '. ' + d.name + '</span><span class="kr">' + [0,1,2].map(j => '<i' + (j < k ? ' class="on"' : '') + '>💎</i>').join('') + '</span>';
    if(open) b.onclick = () => { ensureAc(); startLevel(i); };
    box.appendChild(b);
  });
}
function markSel(){ document.querySelectorAll('.lvl').forEach((e,i) => e.classList.toggle('sel', i === sel)); }
$('#next').onclick = () => startLevel(curLevel + 1);
$('#tomenu').onclick = showMenu; $('#back').onclick = showMenu;
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; if(muted) stopVoice(); $('#mute').blur(); };

const KEYMAP = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down'};
addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if(state === 'menu'){
    if(e.code === 'ArrowRight'){ sel = Math.min(save.open-1, sel+1); markSel(); }
    else if(e.code === 'ArrowLeft'){ sel = Math.max(0, sel-1); markSel(); }
    else if(e.code === 'Space' || e.code === 'Enter'){ if(!e.repeat){ ensureAc(); startLevel(sel); } }
    else if(/^Digit[1-5]$/.test(e.code) && +e.code[5] <= save.open){ ensureAc(); startLevel(+e.code[5]-1); }
    return;
  }
  if(state === 'panel'){
    if((e.code === 'Space' || e.code === 'Enter') && !e.repeat){ curLevel < DEF.length-1 ? startLevel(curLevel+1) : showMenu(); }
    return;
  }
  if(e.code === 'Escape'){ showMenu(); return; }
  const k = KEYMAP[e.code];
  if(k) K[k] = true;
  else if(e.code === 'Space'){ if(!e.repeat) P.buf = .14; K.jump = true; }
  else if(e.code === 'KeyX' || e.code === 'Enter' || e.code === 'KeyF'){ if(!e.repeat) P.spinReq = true; }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if(k) K[k] = false; else if(e.code === 'Space') K.jump = false; });
addEventListener('blur', () => { K.left = K.right = K.up = K.down = K.jump = false; });

let last = performance.now(), accT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last)/1000); last = now;
  if(!SIM){
    accT += dt; let n = 0;
    while(accT >= STEP && n < 6){ update(STEP); accT -= STEP; n++; }
    if(n === 6) accT = 0;
    if(titleT > 0){ titleT -= dt; if(titleT <= 0) $('#title').hidden = true; }
    draw(dt); renderer.render(scene, camera);
  }
}
loadPack().then(() => { $('#loading').textContent = ''; });
setTimeout(() => { $('#loading').textContent = ''; }, 8000);
showMenu(); build(0); requestAnimationFrame(frame);

/* ---------- automatski igrac (samo za provjeru da je svaka staza prohodna) ---------- */
function botInput(B){
  K.left = K.right = K.up = K.down = false;
  const way = lv.way;
  if(P.ground){ const gi = way.indexOf(P.ground); if(gi >= 0) B.t = gi+1; }
  if(P.sprungFrom){ const si = way.indexOf(P.sprungFrom); if(si >= 0) B.t = si+1; P.sprungFrom = null; }
  const tb = way[B.t]; let tx, tz, ty;
  if(!tb){ if(lv.boss && !lv.boss.dead){ tx = lv.boss.x; tz = lv.boss.z; ty = P.y; } else { tx = lv.goal.x; tz = lv.goal.z; ty = lv.goal.y; } }
  else if(tb.spring){ tx = tb.x; tz = tb.z; ty = tb.y; }
  else { const mx = Math.min(.9, tb.w/2-.3), mz = Math.min(.9, tb.d/2-.3);
    tx = clamp(P.x, tb.x-tb.w/2+mx, tb.x+tb.w/2-mx); tz = clamp(P.z, tb.z-tb.d/2+mz, tb.z+tb.d/2-mz); ty = tb.y; }
  let ok = true;
  if(tb && !tb.spring){
    if(tb.off || (tb.fall && tb.fall.s >= 2)) ok = false;
    if(ty - P.y > 1.7 || ty - P.y < -3.5) ok = false;
    if(tb.mv && tb.mv.ax !== 'y'){ const ex = Math.max(0, Math.abs(P.x-tb.x)-tb.w/2), ez = Math.max(0, Math.abs(P.z-tb.z)-tb.d/2); if(Math.hypot(ex,ez) > (lv.G < 25 ? 4 : 3)) ok = false; }
  }
  let dx = tx - P.x, dz = tz - P.z; const dl = Math.hypot(dx,dz) || 1, ux = dx/dl, uz = dz/dl;
  const sup = (x,z) => lv.boxes.some(b => !b.off && !b.crate && ovl(b,x,z,SUP) && b.y <= P.y + STEPUP && b.y >= P.y - .4);
  const edge = P.ground && !sup(P.x + ux*.6, P.z + uz*.6);
  let move = true;
  if(P.ground && edge){ if(ok && P.spin <= 0){ P.buf = .14; K.jump = true; } else { move = false; if(P.ground.mv || P.ground.fall){ dx = P.ground.x - P.x; dz = P.ground.z - P.z; move = Math.hypot(dx,dz) > .4; } } }
  if(!P.ground){
    if(P.vy > 0) K.jump = true;
    const over = tb && !tb.spring && ovl(tb,P.x,P.z,0);
    if(P.vy < -1 && P.jumps < 2 && !over && P.y < ty + 1.5 && tb && !P.sprung){ P.buf = .14; K.jump = true; }
  }
  if(move){ if(dx > .25) K.right = true; else if(dx < -.25) K.left = true; if(dz > .25) K.down = true; else if(dz < -.25) K.up = true; }
  for(const e of lv.en){ if(e.dead) continue; const d = Math.hypot(e.x-P.x, e.z-P.z);
    if(e.type === 'roll'){ if(P.ground && d < 2.3 && Math.abs(e.y-P.y) < 1){ P.buf = .14; K.jump = true; } }
    else if(d < e.r + 1.5 && Math.abs(e.yy-P.y) < 2.5) P.spinReq = true; }
  for(const b of lv.boxes){ if(b.crate && !b.off && Math.hypot(b.x-P.x,b.z-P.z) < 1.7) P.spinReq = true; }
}
window.__bot = function(i, secs){
  SIM = true; simLog = []; startLevel(i);
  const B = {t:0}; let n = 0, won = false;
  for(; n < secs*60; n++){ botInput(B); update(STEP); if(state === 'win'){ won = true; break; } }
  const r = {won, t:+(n/60).toFixed(1), deaths:simLog.length, log:simLog.slice(0,40), at:Math.round(-P.z), wp:B.t, coins, total:lv.total, crystals};
  SIM = false; showMenu(); return r;
};
</script>
