<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}</style>
</head>
<body>
<title>Teo i Bibo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: 3D otok preko cijelog zaslona; zadaci planeta i zvjezdice gore, Bibin oblacic ispod njih, tipke-pomoc dolje.
   Sve velicine prate VISINU zaslona (vh), da stane i na mali djecji laptop. */
:root{
  --sky-top:#3fa9ff; --sky-bottom:#cdf2ff;
  --paper:#ffffff; --ink:#1d2a4d;
  --accent:#ff8a1f; --accent-ink:#ffffff;
  --go:#2fbf5b; --gold:#ffc928;
  --slot:rgba(29,42,77,.22); --shadow:rgba(20,40,90,.28);
  --font:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1c2550; --ink:#f2f5ff; --slot:rgba(255,255,255,.25); --shadow:rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1c2550; --ink:#f2f5ff; --slot:rgba(255,255,255,.25); --shadow:rgba(0,0,0,.5); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{
  background:linear-gradient(var(--sky-top),var(--sky-bottom)) fixed;
  color:var(--ink); font-family:var(--font); overflow:hidden;
  touch-action:none; user-select:none; -webkit-user-select:none;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24'><path d='M4 2l15 9-7 1.5L9 20z' fill='%23ff8a1f' stroke='white' stroke-width='1.8' stroke-linejoin='round'/></svg>") 8 4, auto;
}
button{font-family:inherit; cursor:inherit; border:0; color:inherit; padding:0}
button:focus-visible{outline:4px solid var(--gold); outline-offset:3px}
#c{position:fixed; inset:0; width:100%; height:100%; display:block}

#hud,#start,#again{
  position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; align-items:center; box-sizing:border-box;
  padding-block:calc(1.4vh + env(safe-area-inset-top,0px)) calc(2vh + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
}
#hud{justify-content:space-between}
#top{width:100%; display:flex; align-items:center; justify-content:space-between; gap:1vh 10px; flex-wrap:wrap; min-height:7vh}
.pill{background:var(--paper); border-radius:999px; box-shadow:0 .7vh 0 var(--shadow); padding:.5vh 1.8vh; display:flex; gap:1.4vh; align-items:center}
#levels button{pointer-events:auto; background:none; font-size:clamp(18px,4.6vh,38px); line-height:1.2; opacity:.4; transition:.3s; position:relative}
#levels button.on{opacity:1; transform:scale(1.25)}
#levels button.done::after{content:'★'; position:absolute; right:-.9vh; bottom:-.6vh; font-size:.55em; color:var(--gold); -webkit-text-stroke:1px var(--ink)}
#levels button[data-l="map"]{opacity:1; border-right:.4vh solid var(--slot); padding-right:1.4vh}
#slots span{font-size:clamp(20px,5.4vh,46px); line-height:1; color:var(--slot); transition:color .2s}
#slots span.on{color:var(--gold); animation:pop .5s}
@keyframes pop{0%{transform:scale(.3) rotate(-40deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
#tools{display:flex; gap:8px; margin-left:auto}
#tools button{pointer-events:auto; width:clamp(30px,5.6vh,44px); height:clamp(30px,5.6vh,44px); border-radius:50%; background:var(--paper); font-size:clamp(14px,2.6vh,20px); box-shadow:0 .5vh 0 var(--shadow)}

#bubble{
  align-self:center; max-width:min(92%,620px); background:var(--paper); color:var(--ink);
  font-size:clamp(14px,3.1vh,24px); font-weight:700; line-height:1.2; text-align:center; text-wrap:balance;
  padding:.8vh 2.4vh; border-radius:3vh; box-shadow:0 .7vh 0 var(--shadow); margin-top:1.2vh;
}
#mid{flex:1}
#controls{display:flex; align-items:flex-end; justify-content:center; gap:1.4vh}
#mouseHint{font-size:clamp(34px,9vh,76px); line-height:1; animation:bob 1s infinite alternate ease-in-out}
#colorHint{width:clamp(44px,12vh,88px); height:clamp(44px,12vh,88px); border-radius:50%; border:.7vh solid var(--paper); box-shadow:0 .8vh 0 var(--shadow); animation:bob 1s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-1.6vh) rotate(-8deg)}}
#pad{display:grid; grid-template-columns:repeat(3,auto); gap:1vh; justify-items:center}
.key{
  pointer-events:auto; background:var(--paper); color:var(--ink); font-weight:800;
  border-radius:1.8vh; box-shadow:0 .9vh 0 var(--shadow); transition:transform .08s, background .08s, box-shadow .08s;
}
#pad .key,#nums .key{width:clamp(34px,8.6vh,68px); height:clamp(34px,8.6vh,68px); font-size:clamp(18px,4.2vh,34px)}
#pad .key[data-k="up"]{grid-column:2}
#pad .key[data-k="left"]{grid-column:1}
#pad.lr .key[data-k="up"],#pad.lr .key[data-k="down"]{display:none}
#pad.lr{grid-template-columns:repeat(2,auto); gap:3vh}
#nums{display:flex; gap:1.1vh; flex-wrap:wrap; justify-content:center}
#spaceBtn{width:min(64vw,440px); height:clamp(40px,9vh,72px); font-size:clamp(15px,3.2vh,26px); letter-spacing:.12em}
#letterKey{width:clamp(70px,19vh,140px); height:clamp(60px,16vh,120px); display:flex; align-items:baseline; justify-content:center; gap:1.2vh; line-height:1.55}
#letterKey b{font-size:clamp(38px,11vh,84px); font-weight:800}
#letterKey small{font-size:clamp(22px,6vh,46px); font-weight:700; opacity:.6}
#mic{display:flex; flex-direction:column; align-items:center; gap:.6vh}
#mic span{width:clamp(44px,12vh,88px); height:clamp(44px,12vh,88px); border-radius:50%; background:var(--paper); box-shadow:0 .8vh 0 var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:clamp(22px,6.5vh,48px); line-height:1; opacity:.55; transition:.2s}
#mic.live span{opacity:1; background:var(--go); animation:pulse .5s infinite alternate ease-in-out}
#mic small{font-size:clamp(11px,2.2vh,15px); font-weight:700; background:var(--paper); border-radius:2vh; padding:0 1.4vh; min-height:1em; max-width:50vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#mic small:empty{visibility:hidden}
.key.on{background:var(--accent); color:var(--accent-ink); transform:translateY(.7vh); box-shadow:0 .2vh 0 var(--shadow)}
.pulse{animation:pulse 1s infinite alternate ease-in-out}
@keyframes pulse{to{transform:scale(1.08)}}

#start{justify-content:space-between; text-align:center}
#start h1{margin:0; font-size:clamp(34px,15vh,110px); font-weight:800; line-height:1; color:var(--accent-ink);
  -webkit-text-stroke:.5vh var(--ink); paint-order:stroke fill; text-shadow:0 1vh 0 var(--shadow)}
#start h1 b{color:var(--gold)}
#start .bottom{display:flex; flex-direction:column; align-items:center; gap:1.6vh}
#play,#replay{
  pointer-events:auto; width:clamp(76px,22vh,170px); height:clamp(76px,22vh,170px); border-radius:50%;
  background:var(--go); color:var(--accent-ink); font-size:clamp(36px,11vh,90px); line-height:1;
  box-shadow:0 1.3vh 0 var(--shadow); border:.8vh solid var(--accent-ink);
}
#start p{margin:0; font-size:clamp(11px,2.2vh,15px); font-weight:500; background:var(--paper); padding:.6vh 2vh; border-radius:2vh; max-width:600px}
#again{justify-content:flex-end; padding-bottom:calc(5vh + env(safe-area-inset-bottom,0px))}
#replay{background:var(--accent)}
@media (prefers-reduced-motion: reduce){ .pulse,#mouseHint,#colorHint,#slots span.on{animation:none} }
</style>

<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div id="levels" class="pill" hidden></div>
    <div id="slots" class="pill" hidden></div>
    <div id="tools">
      <button id="mute" aria-label="Zvuk uključen ili isključen">🔊</button>
      <button id="full" aria-label="Cijeli zaslon">⛶</button>
    </div>
  </div>
  <div id="bubble" hidden></div>
  <div id="mid"></div>
  <div id="controls">
    <div id="mouseHint" hidden>🖱️</div>
    <div id="colorHint" hidden></div>
    <div id="pad" hidden>
      <button class="key" data-k="up" aria-label="Gore">▲</button>
      <button class="key" data-k="left" aria-label="Lijevo">◀</button>
      <button class="key" data-k="down" aria-label="Dolje">▼</button>
      <button class="key" data-k="right" aria-label="Desno">▶</button>
    </div>
    <button id="spaceBtn" class="key" hidden>RAZMAK</button>
    <div id="nums" hidden></div>
    <button id="letterKey" class="key" hidden></button>
    <div id="mic" hidden><span>🎤</span><small id="heard"></small></div>
  </div>
</div>

<div id="start">
  <h1>Teo <b>i</b> Bibo</h1>
  <div class="bottom">
    <button id="play" class="pulse" aria-label="Kreni" hidden>▶</button>
    <p id="loading">Učitavam Bibin glas…</p>
    <p>Za roditelje: uključite zvuk. Bibo govori snimljenim glasom; ako se snimke ne učitaju, govori glasom uređaja.Teo bira planet, a sličice gore lijevo biraju zadatak na planetu. Za zadatke u kojima odgovara glasom dopustite mikrofon.</p>
  </div>
</div>

<div id="again" hidden><button id="replay" class="pulse" aria-label="Natrag na kartu planeta">🪐</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const NAME = 'Teo';          // ime djeteta koje Bibo izgovara
const GOAL = 5;              // zvjezdica po zadatku
const ICON = {balloons:'🎈', colors:'🎨', size:'📏', shapes:'🔺', flies:'🦋', stars:'⭐', jump:'🚀', catch:'🌠', hurdles:'🏃',
  animals:'🐶', sounds:'🐮', things:'🚗', odd:'🤔', count:'🔢', digits:'7️⃣', letters:'🔤', piano:'🎹', sayit:'🎤', saycolor:'🌈', saycount:'🗣️',
  feed:'🍽️', apples:'🍎', memory:'🃏', countdown:'⏱️', gather:'✨', more:'⚖️', aliens:'👽', faces:'😀', clothes:'👕', weather:'🌧️',
  vehicles:'🚚', turn:'↔️', light:'🚦', rise:'🎉', hide:'🎁', dodge:'☄️',
  foods:'🥕', memfood:'🍓', memcars:'🚙', memmix:'🧠'};
const WORLDS = [
  {n:'Planet balona', e:'🎈', col:0xff5d7a, grass:0x6fd35b, side:0x4fae45, sky:['#3fa9ff','#cdf2ff'], levels:['balloons','colors','size','shapes','flies']},
  {n:'Planet skakanja', e:'🚀', col:0xffb02e, grass:0xf0c668, side:0xd6a23e, sky:['#ff9a57','#ffecc2'], levels:['stars','jump','catch','hurdles']},
  {n:'Planet životinja', e:'🐶', col:0x39c46a, grass:0x58c98a, side:0x3aa56c, sky:['#2fc4bb','#d6fff3'], levels:['animals','sounds','things','odd']},
  {n:'Planet brojeva i slova', e:'🔢', col:0x6a7bff, grass:0x9aa8ff, side:0x7684e6, sky:['#6d5cff','#e6e0ff'], levels:['count','digits','letters','piano']},
  {n:'Planet razgovora', e:'🎤', col:0xd76bff, grass:0xf29ad0, side:0xd476b0, sky:['#ff6fb1','#ffe3f1'], levels:['sayit','saycolor','saycount']},
  {n:'Planet hrane', e:'🍎', col:0xff7043, grass:0xffd08a, side:0xe0a85c, sky:['#ff8a65','#fff0d6'], levels:['feed','foods','apples']},
  {n:'Svemirski planet', e:'👽', col:0x5c6bc0, grass:0xb9b4d6, side:0x8f8ab5, sky:['#141a4d','#5a4aa8'], space:true, levels:['countdown','gather','more','aliens']},
  {n:'Planet smijeha', e:'😀', col:0xffd54f, grass:0xa5e06a, side:0x7fc04a, sky:['#34b3ff','#fff6c9'], levels:['faces','clothes','weather']},
  {n:'Planet prometa', e:'🚗', col:0x607d8b, grass:0xbfc7cc, side:0x98a3a9, sky:['#5aa9e6','#e8f4ff'], levels:['vehicles','turn','light']},
  {n:'Planet zabave', e:'🎪', col:0xe040fb, grass:0xffb3e6, side:0xe085c5, sky:['#7c4dff','#ffd6f5'], levels:['rise','hide','dodge']},
  {n:'Planet pamćenja', e:'🃏', col:0x26a69a, grass:0x9be0d6, side:0x6fc0b5, sky:['#00897b','#d9fff8'], levels:['memory','memfood','memcars','memmix']}
];
/* mjesta planeta na karti: tri reda u cik-cak rasporedu, s prolazima za brod */
const MAPPOS = [[-6,4.5],[-2,4.5],[2,4.5],[6,4.5],[-4,2.05],[0,2.05],[4,2.05],[-6,-.4],[-2,-.4],[2,-.4],[6,-.4]];
const LEVELS = [].concat(...WORLDS.map(w => w.levels));
const $ = s => document.querySelector(s);
const canvas = $('#c');

/* ---------- scena ---------- */
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
function resize(){
  const w = window.innerWidth||800, h = window.innerHeight||600, a = w/h;
  renderer.setSize(w, h, false);
  camera.aspect = a;
  camera.position.set(0, 5.6, Math.min(34, a < 1.5 ? 13*1.5/a : 13));
  camera.lookAt(0, 2.2, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
function setSky(a, b){ const s = document.documentElement.style; s.setProperty('--sky-top', a); s.setProperty('--sky-bottom', b); }

scene.add(new THREE.HemisphereLight(0xffffff, 0x7fbf6a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(5,10,7); scene.add(sun);

const mats = {};
function mat(color, o){ const k = color+JSON.stringify(o||{}); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({color, roughness:.55, metalness:.05}, o||{}))); }
function glow(color){ return mat(color, {emissive:color, emissiveIntensity:.9}); }
function mesh(geo, m, x,y,z, parent){ const o = new THREE.Mesh(geo, m); o.position.set(x||0,y||0,z||0); (parent||scene).add(o); return o; }
const SPH = new THREE.SphereGeometry(1, 28, 20);
const rnd = (a,b) => a + Math.random()*(b-a);
const rndi = n => Math.floor(Math.random()*n);
const pick = a => a[rndi(a.length)];
const shuffle = a => { const b = a.slice(); for(let i = b.length-1; i > 0; i--){ const j = rndi(i+1); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; };

/* otok (boja tla se mijenja po planetu) */
const GRASS = new THREE.MeshStandardMaterial({color:0x6fd35b, roughness:.55}), SIDE = new THREE.MeshStandardMaterial({color:0x4fae45, roughness:.55});
const land = new THREE.Group(); scene.add(land);   // otok se skriva dok smo u svemiru
mesh(new THREE.CylinderGeometry(7.2,7.2,.6,56), GRASS, 0,-.3,0, land);
mesh(new THREE.CylinderGeometry(7.25,6.6,.5,56), SIDE, 0,-.75,0, land);
const under = mesh(new THREE.ConeGeometry(6.6,5,40), mat(0x9a6a44), 0,-3.5,0, land); under.rotation.x = Math.PI;
for(let i=0;i<26;i++){
  const a = rnd(0,Math.PI*2), r = rnd(2.2,6.8), x = Math.cos(a)*r, z = Math.sin(a)*r;
  mesh(new THREE.CylinderGeometry(.03,.03,.3,6), mat(0x3d9140), x,.15,z, land);
  const f = mesh(SPH, mat([0xff6f91,0xffd23f,0xffffff,0xb388ff,0xff9f43][i%5]), x,.34,z, land); f.scale.set(.13,.09,.13);
}
[[-5.4,-3.2,1.2],[5.2,-3.6,1.4],[-2.6,-5.6,1],[2.9,-5.4,.9],[6.2,-.4,.8],[-6.3,-.2,.8]].forEach(([x,z,s])=>{
  mesh(new THREE.CylinderGeometry(.18*s,.24*s,1.2*s,10), mat(0x8a5a35), x,.6*s,z, land);
  const c1 = mesh(SPH, mat(0x2fa35a), x,1.7*s,z, land); c1.scale.set(.95*s,.85*s,.95*s);
  const c2 = mesh(SPH, mat(0x3fbf6a), x+.3*s,2.3*s,z, land); c2.scale.set(.6*s,.55*s,.6*s);
});
const clouds = [];
for(let i=0;i<7;i++){
  const g = new THREE.Group();
  for(let j=0;j<4;j++){ const p = mesh(SPH, mat(0xffffff,{roughness:1}), j*.9-1.3, rnd(-.15,.25), rnd(-.3,.3), g); const s = rnd(.6,1); p.scale.set(s,s*.7,s); }
  g.position.set(rnd(-20,20), rnd(3,10), rnd(-22,-9)); g.userData.v = rnd(.15,.5); scene.add(g); clouds.push(g);
}
const spaceStars = (function(){
  const pos = []; for(let i=0;i<260;i++) pos.push(rnd(-45,45), rnd(-8,28), rnd(-40,-22));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({color:0xffffff, size:.25})); p.visible = false; scene.add(p); return p;
})();

/* ---------- robot Bibo ---------- */
const WHITE = mat(0xffffff,{roughness:.3}), ORANGE = mat(0xff8a1f,{roughness:.4}), DARK = mat(0x18203f,{roughness:.15, metalness:.3});
const bot = new THREE.Group(); scene.add(bot);
const body = mesh(SPH, WHITE, 0,.95,0, bot); body.scale.set(.5,.55,.45);
const chest = mesh(SPH, glow(0x4de8ff), 0,1.0,.42, bot); chest.scale.set(.1,.1,.05);
const scarf = mesh(new THREE.TorusGeometry(.32,.09,10,24), ORANGE, 0,1.42,0, bot); scarf.rotation.x = Math.PI/2;
const head = new THREE.Group(); head.position.set(0,1.85,0); bot.add(head);
const skull = mesh(SPH, WHITE, 0,0,0, head); skull.scale.set(.58,.48,.5);
const visor = mesh(SPH, DARK, 0,0,.2, head); visor.scale.set(.44,.3,.33);
const EYE = glow(0x4de8ff);
const eyes = [-1,1].map(s => { const e = mesh(SPH, EYE, s*.16,.01,.5, head); e.scale.set(.075,.1,.04); return e; });
const smiles = [-1,1].map(s => { const e = mesh(new THREE.TorusGeometry(.08,.028,8,16,Math.PI), EYE, s*.16,-.02,.52, head); e.visible = false; return e; });
[-1,1].forEach(s => { const ear = mesh(new THREE.CylinderGeometry(.14,.14,.12,16), ORANGE, s*.6,0,0, head); ear.rotation.z = Math.PI/2; });
mesh(new THREE.CylinderGeometry(.025,.025,.35,8), mat(0x8891aa), 0,.62,0, head);
const antenna = mesh(SPH, glow(0xff8a1f), 0,.84,0, head); antenna.scale.setScalar(.1);
const arms = [-1,1].map(s => {
  const p = new THREE.Group(); p.position.set(s*.5,1.25,0); bot.add(p);
  mesh(new THREE.CylinderGeometry(.08,.08,.45,10), WHITE, 0,-.22,0, p);
  const h = mesh(SPH, ORANGE, 0,-.52,0, p); h.scale.setScalar(.13);
  p.userData.s = s; return p;
});
const legs = [-1,1].map(s => {
  const p = new THREE.Group(); p.position.set(s*.2,.48,0); bot.add(p);
  mesh(new THREE.CylinderGeometry(.09,.09,.3,10), WHITE, 0,-.18,0, p);
  const f = mesh(SPH, ORANGE, 0,-.38,.06, p); f.scale.set(.15,.1,.22);
  return p;
});
const blob = mesh(new THREE.CircleGeometry(.6,24), new THREE.MeshBasicMaterial({color:0x103010, transparent:true, opacity:.28, depthWrite:false}), 0,.02,0);
blob.rotation.x = -Math.PI/2;

/* ---------- zvjezdice, baloni ---------- */
function starGeo(){
  const s = new THREE.Shape();
  for(let i=0;i<10;i++){ const r = i%2 ? .23 : .52, a = i/10*Math.PI*2 + Math.PI/2, x = Math.cos(a)*r, y = Math.sin(a)*r; i ? s.lineTo(x,y) : s.moveTo(x,y); }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth:.16, bevelEnabled:true, bevelThickness:.05, bevelSize:.05, bevelSegments:2});
  g.center(); return g;
}
const STARGEO = starGeo(), STARMAT = mat(0xffc928,{emissive:0xffa000, emissiveIntensity:.5, roughness:.3});
const star = mesh(STARGEO, STARMAT, 0,1,0); star.visible = false;
const starBlob = mesh(new THREE.CircleGeometry(.4,20), blob.material, 0,.02,0); starBlob.rotation.x = -Math.PI/2; starBlob.visible = false;
const countStars = [0,1,2,3,4,5,6,7,8].map(() => { const s = mesh(STARGEO, STARMAT, 0,3.9,0); s.visible = false; s.userData = {y:3.9, sz:1}; return s; });

const BCOL = [0xff4d6d,0xffc928,0x3ecf8e,0x4d9bff,0xb86bff];
/* n = muski rod (balon je CRVENI), k = korijeni koje priznajemo u govoru */

function disc(x){ x.fillStyle = '#ffffff'; x.beginPath(); x.arc(128,128,122,0,Math.PI*2); x.fill(); x.lineWidth = 10; x.strokeStyle = '#ff8a1f'; x.stroke(); }
function emojiTex(e, plain){
  const key = e + (plain ? '|p' : '');
  if(texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  if(!plain) disc(x);
  x.font = (plain ? 210 : 150) + 'px "Noto Color Emoji","Segoe UI Emoji","Apple Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(e, 128, 140);
  return texCache[key] = new THREE.CanvasTexture(c);
}
function shapeTex(it){
  const key = 'shape|'+it.shape;
  if(texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); disc(x);
  x.fillStyle = it.col; x.strokeStyle = '#1d2a4d'; x.lineWidth = 7; x.lineJoin = 'round'; x.beginPath();
  if(it.shape === 'circle') x.arc(128,128,70,0,Math.PI*2);
  else if(it.shape === 'square') x.rect(66,66,124,124);
  else if(it.shape === 'rect') x.rect(48,86,160,84);
  else if(it.shape === 'triangle'){ x.moveTo(128,52); x.lineTo(204,188); x.lineTo(52,188); x.closePath(); }
  else if(it.shape === 'star'){ for(let i=0;i<10;i++){ const r = i%2 ? 36 : 82, a = i/10*Math.PI*2 - Math.PI/2; const px = 128+Math.cos(a)*r, py = 132+Math.sin(a)*r; i ? x.lineTo(px,py) : x.moveTo(px,py); } x.closePath(); }
  else if(it.shape === 'heart'){ x.moveTo(128,196); x.bezierCurveTo(28,128,58,48,128,96); x.bezierCurveTo(198,48,228,128,128,196); x.closePath(); }
  x.fill(); x.stroke();
  return texCache[key] = new THREE.CanvasTexture(c);
}

let ac = null, muted = false;
function tone(f, d, type, v, when, f2){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when||0);
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(v||.2, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}

let voice = null, talking = false, talkTimer = 0, sayId = 0;
const synth = window.speechSynthesis;
function pickVoice(){
  if(!synth) return;
  /* biramo najprirodniji dostupni glas: hrvatski prije srodnih, mrezni/"natural" prije ugradenog */
  const vs = synth.getVoices(); let best = null, bestScore = -1;
  for(const v of vs){
    const l = (v.lang||'').toLowerCase().replace('_','-'), li = ['hr','bs','sr','sl'].findIndex(p => l.startsWith(p));
    if(li < 0) continue;
    const n = (v.name||'').toLowerCase();
    let s = (4-li)*100;
    if(/natural|neural|online|premium|enhanced|wavenet/.test(n)) s += 50;
    if(n.includes('google')) s += 30;
    if(v.localService === false) s += 10;
    if(s > bestScore){ bestScore = s; best = v; }
  }
  voice = best;
}

const SPLIT = /(?<=[.!?])\s+/;
let pack = null, packBin = null, curSrc = null;
const bufCache = new Map();
window.__miss = [];
function ensureAc(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state === 'suspended') ac.resume(); }catch(e){} return ac; }
let packUrl = '', packSize = 0, probe = null;
async function loadPack(){
  try{
    const idx = await (await fetch('glas.json', {cache:'no-cache'})).json();
    packUrl = 'glas.mp3?v=' + idx.v; packSize = idx.size; pack = idx.clips;
  }catch(e){ pack = null; }
}
/* Svaka recenica se dohvaca zasebno (HTTP Range), pa se nista veliko ne ucitava unaprijed.
   Ako posluzitelj ne podrzava Range i vrati cijelu datoteku, zadrzimo je i dalje rezemo iz nje. */
async function clipBytes(s){
  const off = pack[s][0], len = pack[s][1];
  if(probe) await probe;
  if(packBin) return packBin.slice(off, off+len);
  const job = (async () => {
    const r = await fetch(packUrl, {headers:{Range:'bytes='+off+'-'+(off+len-1)}});
    const ab = await r.arrayBuffer();
    if(r.status === 206 && ab.byteLength === len) return ab;
    if(ab.byteLength >= packSize){ packBin = ab; return ab.slice(off, off+len); }
    throw new Error('range');
  })();
  if(!probe) probe = job.then(() => {}, () => {});
  return job;
}
function clipBuf(s){
  if(bufCache.has(s)) return bufCache.get(s);
  const p = clipBytes(s).then(ab => new Promise((res, rej) => ac.decodeAudioData(ab, res, rej)));
  bufCache.set(s, p); p.catch(() => bufCache.delete(s));
  return p;
}
/* snimke imaju tisinu na pocetku i kraju; rezemo je da recenice teku jedna za drugom bez dugih stanki */
function trimOf(b){
  if(b._t) return b._t;
  const d = b.getChannelData(0), n = d.length, sr = b.sampleRate; let a = 0, e = n-1;
  while(a < n && Math.abs(d[a]) < .012) a++;
  while(e > a && Math.abs(d[e]) < .012) e--;
  const s = Math.max(0, a/sr - .03);
  return b._t = [s, Math.min(b.duration - s, (e-a)/sr + .25)];
}
function playBuf(b){
  return new Promise(res => {
    const src = ac.createBufferSource(), t = trimOf(b); src.buffer = b; src.connect(ac.destination); src.onended = res; curSrc = src; src.start(0, t[0], t[1]);
  });
}
function stopVoice(){
  if(curSrc){ try{ curSrc.onended = null; curSrc.stop(); }catch(e){} curSrc = null; }
  if(synth){ try{ synth.cancel(); }catch(e){} }
}
function speakTTS(s){
  return new Promise(res => {
    const ms = 700 + s.length*65;
    if(voice && synth){
      try{
        const u = new SpeechSynthesisUtterance(s);
        u.voice = voice; u.lang = voice.lang; u.pitch = 1.08; u.rate = .9; u.volume = 1;
        u.onend = u.onerror = res; synth.speak(u);
      }catch(e){}
      setTimeout(res, ms + 4000);
    } else { sfx.beeps(Math.min(9, Math.ceil(s.length/7))); setTimeout(res, ms); }
  });
}
function say(text, onDone){
  stopListen();                      // dok Bibo govori ne slusamo, da ne cuje sam sebe
  bubble.textContent = text; bubble.hidden = false;
  clearTimeout(talkTimer); stopVoice();
  const id = ++sayId, ms = 700 + text.length*65;
  const cb = onDone || (voiceRound() ? listen : null);
  let fired = false;
  const fin = () => { if(id !== sayId || fired) return; fired = true; talking = false; if(cb) cb(); };
  talking = true;
  if(muted){ talkTimer = setTimeout(fin, ms); return; }
  (async () => {
    const parts = text.split(SPLIT);
    if(pack && ensureAc()) parts.forEach(s => { if(pack[s]) clipBuf(s).catch(() => {}); });   // sve recenice dohvati odmah, usporedno
    for(const s of parts){
      if(id !== sayId) return;
      if(pack && pack[s] && ensureAc()){
        try{ const b = await clipBuf(s); if(id !== sayId) return; await playBuf(b); continue; }catch(e){}
      } else if(pack) window.__miss.push(s);
      if(id !== sayId) return;
      await speakTTS(s);
    }
    fin();
  })();
  talkTimer = setTimeout(fin, ms + 15000);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOK = !!SR, rec = null, listening = false, wantListen = false, vr = null, vMiss = 0;
const MICERR = ['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'];
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function voiceRound(){ return mode === 'voice' && roundActive && !!vr && !busy; }
function setMic(){ $('#mic').classList.toggle('live', listening); }
function stopListen(){ wantListen = false; if(rec && listening){ try{ rec.abort(); }catch(e){} } }
function listen(){
  if(!voiceRound() || !micOK) return;
  if(!rec){
    rec = new SR(); rec.lang = 'hr-HR'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
    rec.onresult = onHeard;
    rec.onerror = e => { if(MICERR.includes(e.error)){ micOK = false; wantListen = false; micFallback(); } };
    rec.onend = () => { listening = false; setMic(); if(wantListen) setTimeout(listen, 250); };
  }
  wantListen = true;
  if(listening) return;
  try{ rec.start(); listening = true; }catch(e){ setTimeout(() => { if(wantListen) listen(); }, 500); }
  setMic();
}
function onHeard(e){
  if(!voiceRound()) return;
  let all = '', fin = false, last = '';
  for(let i = e.resultIndex; i < e.results.length; i++){
    const r = e.results[i]; if(r.isFinal) fin = true;
    for(let j = 0; j < r.length; j++){ all += ' ' + r[j].transcript; }
    last = r[0].transcript;
  }
  $('#heard').textContent = last.trim();
  lastAction = T;
  if(vr.match(norm(all))){ const v = vr; stopListen(); roundActive = false; v.right(false); return; }
  if(!fin) return;
  vMiss++;
  if(vMiss >= 3){ const v = vr; stopListen(); roundActive = false; v.right(true); return; }
  if(vMiss === 2 && state === 'saycount') $('#nums').hidden = false;
  sfx.oops();
  say(vMiss === 1 ? 'Nisam dobro čuo. Reci još jednom, glasno!' : vr.help, listen);
}
function startVoice(cfg, q){ vr = cfg; vMiss = 0; roundActive = true; $('#heard').textContent = ''; say(q, listen); }
function micFallback(){
  listening = false; setMic();
  if(mode !== 'voice') return;
  roundActive = false;
  say('Mikrofon ne radi. Odgovaraj klikom!');
  later(() => setLevel(state), 2600);
}

  say((first ? intro : '') + 'Pritisni '+keyName(letter)+'!');
}
function typed(ch){
  if(!(state === 'letters' || state === 'digits' || state === 'countdown') || !roundActive || busy) return;
  lastAction = T;
  if(ch === letter){
    roundActive = false;
    const k = $('#letterKey'); k.classList.add('on'); setTimeout(() => k.classList.remove('on'), 300);
    jump(); burst(new THREE.Vector3(bot.position.x, 3, bot.position.z), null, 16, 4);
    if(state === 'countdown'){
      const last = count === GOAL-1;
      if(last){ pics[7].rocket = true; sfx.whoosh(); }
      addStar(null, last ? 'Jedan! Kreni! Raketa leti!' : cap(numName(letter))+'!');
      if(count < GOAL) later(() => keyRound(false), 1300);
      return;
    }
    addStar(null, 'Bravo! '+cap(keyName(letter))+'!');
    if(count < GOAL) later(() => keyRound(false), 1700);
  } else { sfx.oops(); say('To je '+keyName(ch)+'. Nađi '+keyName(letter)+'!'); }
}
/* reci sto je na slicici */
const SAYPOOL = ANIMALS.concat(THINGS);
function sayItRound(first){
  clearPics();
  let it; do{ it = pick(SAYPOOL); }while(it === sayItem); sayItem = it;
  showPic(1, it, 0, 4, 2);
  question = 'Što je ovo? Reci glasno!';
  startVoice({
    match: h => it.k.some(s => h.includes(s)),
    help: toJe(it)+'. Reci: '+it.n+'!',
    right: helped => {
      sfx.pop(); burst(pics[1].sp.position, null, 18, 5); clearPics();
      addStar(null, helped ? toJe(it)+'!' : 'Tako je! '+cap(it.n)+'!');
      if(count < GOAL) later(() => sayItRound(false), 1800);
    }
  }, first ? 'Sada mi odgovaraj glasom! Što je ovo?' : 'Što je ovo?');
}
/* reci kakav je balon (crveni, plavi...) */
function sayColorRound(first){
  clearBalloons();
  let t; do{ t = rndi(COLORS.length); }while(t === target); target = t;
  const c = COLORS[t];
  makeBalloon(c.c, new THREE.Vector3(0,4.1,0), t);
  question = 'Kakav je ovo balon? Reci glasno!';
  startVoice({
    match: h => c.k.some(s => h.includes(s)),
    help: 'Ovo je '+c.n+' balon. Reci: '+c.n+'!',
    right: helped => {
      const b = balloons[0]; if(b){ sfx.pop(); burst(b.g.position, b.col, 18, 5); }
      clearBalloons();
      addStar(null, helped ? 'Ovo je '+c.n+' balon!' : 'Tako je! '+cap(c.n)+' balon!');
      if(count < GOAL) later(() => sayColorRound(false), 1900);
    }
  }, first ? 'Kakav je ovo balon? Koje je boje? Reci glasno!' : 'Kakav je ovo balon?');
}
/* reci koliko je zvjezdica */
function sayCountRound(first){
  pickCount(); $('#nums').hidden = true;
  const n = countN;
  question = 'Koliko je zvjezdica? Reci broj!';
  startVoice({
    match: h => { const w = h.split(/[^a-z0-9]+/); return NUMK[n-1].some(x => w.includes(x)); },
    help: 'Izbroji sa mnom! '+cap(NUMF[n-1])+'. Reci: '+NUMSAY[n-1]+'!',
    right: helped => countRight(helped)
  }, first ? 'Izbroji zvjezdice i reci mi broj! Koliko ih je?' : 'Koliko je zvjezdica?');
}
function tickle(){ spin = Math.PI*2; happy = Math.max(happy,1.5); sfx.giggle(); say('Hi hi hi! To škaklja!'); lastAction = T; }
function popIt(b){ balloons = balloons.filter(x => x !== b); scene.remove(b.g); hovered = null; sfx.pop(); burst(b.g.position, b.col, 18, 5); addStar(); }
function clickBalloon(b){
  lastAction = T;
  if(mode === 'sizeclick'){
    if(busy) return;
    if(b.size !== (sizeWant === 'najveći' ? 1.5 : .5)){ b.shake = .5; sfx.oops(); say('Taj nije '+sizeWant+'. Nađi '+sizeWant+' balon!'); return; }
    popIt(b); if(count < GOAL) later(() => sizeRound(false), 1500);
    return;
  }
  if(mode === 'colorclick'){
    if(busy) return;
    if(b.ci !== target){ b.shake = .5; sfx.oops(); say('To je '+COLORS[b.ci].n+' balon. Nađi '+COLORS[target].n+' balon!'); return; }
    popIt(b); if(count < GOAL) later(() => colorRound(false), 1500);
    return;
  }
  popIt(b);
  if(state === 'rise' && count < GOAL) later(() => spawnRiser(), 500);
}

/* ---------- unos ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(0,0);
function setNdc(e){ const r = canvas.getBoundingClientRect(); ndc.x = (e.clientX-r.left)/r.width*2-1; ndc.y = -(e.clientY-r.top)/r.height*2+1; }
function cast(list){ scene.updateMatrixWorld(); ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(list, false); return h.length ? h[0].object : null; }
function pickBalloon(){
  if(!(mode === 'pop' || mode === 'colorclick' || mode === 'sizeclick') || !balloons.length) return null;
  const o = cast(balloons.map(b => b.hit)); return o ? balloons.find(b => b.hit === o) : null;
}
function pickPic(){
  if(!(mode === 'picclick' || mode === 'flyclick' || mode === 'memory' || mode === 'hide')) return null;
  const vis = pics.filter(p => p.sp.visible); if(!vis.length) return null;
  const o = cast(vis.map(p => p.sp)); return o ? vis.find(p => p.sp === o) : null;
}
function pickPlanet(){
  if(state !== 'map' || busy) return -1;
  const o = cast(planets.map(p => p.hit)); return o ? planets.find(p => p.hit === o).i : -1;
}
function focusPlanet(i){ if(i !== sel){ sel = i; if(i >= 0){ say(WORLDS[i].n+'!'); lastAction = T; } } }
canvas.addEventListener('pointermove', e => {
  setNdc(e); hovered = pickBalloon(); hoveredPic = pickPic();
  if(state === 'map' && !busy){ const i = pickPlanet(); hoverPl = i; if(i >= 0) focusPlanet(i); }
});
canvas.addEventListener('pointerdown', e => {
  if(state === 'start') return;
  setNdc(e);
  if(state === 'map'){   // klik na planet: brod leti do njega; klik u prazno: brod leti na to mjesto
    if(busy) return;
    const pl = pickPlanet(); lastAction = T;
    if(pl >= 0){ const p = planets[pl].g.position; destPlanet = pl; dest = {x:p.x, y:p.y}; focusPlanet(pl); }
    else { ray.setFromCamera(ndc, camera); const t = (.6 - ray.ray.origin.z)/ray.ray.direction.z; destPlanet = -1; dest = {x:ray.ray.origin.x + ray.ray.direction.x*t, y:ray.ray.origin.y + ray.ray.direction.y*t}; }
    return;
  }
  const b = pickBalloon(); if(b){ clickBalloon(b); return; }
  const p = pickPic(); if(p){ clickPic(p); return; }
  if(state === 'more' && ndc.y > -.15 && Math.abs(ndc.x) > .12){ moreAnswer(ndc.x < 0 ? -1 : 1); return; }
  ray.setFromCamera(ndc, camera);
  if(ray.intersectObject(bot, true).length) tickle();
});
const KEYMAP = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
function padBtn(k){ return document.querySelector('#pad .key[data-k="'+k+'"]'); }
window.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(state === 'start'){ if(e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); begin(); } return; }
  if(state === 'map'){
    if((e.code === 'Enter' || e.code === 'Space') && sel >= 0 && !busy){ e.preventDefault(); const p = planets[sel].g.position; destPlanet = sel; dest = {x:p.x, y:p.y}; return; }
  }
  const k = KEYMAP[e.code];
  if(k){ e.preventDefault(); keys[k] = true; padBtn(k).classList.add('on'); if(state === 'turn' && !e.repeat) turnAnswer(k); }
  if(e.code === 'Space'){ e.preventDefault(); $('#spaceBtn').classList.add('on'); if(!e.repeat) jump(); }
  if(e.repeat) return;
  if(mode === 'piano' && /^[1-9]$/.test(e.key)) playKey(+e.key);
  if((state === 'count' || state === 'saycount') && /^[1-9]$/.test(e.key)) answer(+e.key);
  if((state === 'digits' || state === 'countdown') && /^[0-9]$/.test(e.key)) typed(e.key);
  if(state === 'more' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) moreAnswer(e.code === 'ArrowLeft' ? -1 : 1);
  if(state === 'letters' && e.key.length === 1 && /[a-zA-ZčćžšđČĆŽŠĐ]/.test(e.key)) typed(e.key.toUpperCase());
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if(k){ keys[k] = false; padBtn(k).classList.remove('on'); }
  if(e.code === 'Space') $('#spaceBtn').classList.remove('on');
});
window.addEventListener('blur', () => { for(const k in keys){ keys[k] = false; padBtn(k).classList.remove('on'); } });
document.querySelectorAll('#pad .key').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); if(state === 'more' && (k === 'left' || k === 'right')) moreAnswer(k === 'left' ? -1 : 1); if(state === 'turn') turnAnswer(k); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; b.classList.remove('on'); }));
});
$('#nums').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; if(mode === 'piano') playKey(+b.dataset.n); else answer(+b.dataset.n); b.blur(); });
$('#letterKey').addEventListener('click', () => { typed(letter); $('#letterKey').blur(); });
$('#spaceBtn').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
$('#levels').addEventListener('click', e => { const b = e.target.closest('button'); if(!b || state === 'start') return; setLevel(b.dataset.l); });
$('#mute').addEventListener('click', () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; if(muted) stopVoice(); $('#mute').blur(); });
$('#full').addEventListener('click', () => {
  try{ if(document.fullscreenElement) document.exitFullscreen(); else { const p = document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(()=>{}); } }catch(e){}
  $('#full').blur();
});
if(!document.fullscreenEnabled) $('#full').hidden = true;
function begin(){
  if(state !== 'start') return;
  $('#start').hidden = true; $('#hud').hidden = false; pickVoice(); ensureAc();
  if(SR){ // pitaj za mikrofon odmah, dok je roditelj tu
    try{
      const p = new SR(); p.lang = 'hr-HR';
      p.onstart = () => { try{ p.abort(); }catch(e){} };
      p.onerror = e => { if(MICERR.includes(e.error)) micOK = false; };
      p.start();
    }catch(e){}
  }
  tone(660,.1,'sine',.15); setLevel('map');
}
$('#play').addEventListener('click', begin);
/* glas se ucitava prije pocetka; ako ne uspije (ili traje predugo), igra krece s glasom uredaja */
(function(){
  const ready = () => { $('#loading').hidden = true; $('#play').hidden = false; };
  const t = setTimeout(ready, 8000);
  loadPack().then(() => { clearTimeout(t); ready(); });
})();
$('#replay').addEventListener('click', () => { happy = 0; setLevel('map'); });

/* ---------- petlja ---------- */
const lerp = (a,b,t) => a + (b-a)*t;
function lerpAngle(a,b,t){ let d = (b-a) % (Math.PI*2); if(d > Math.PI) d -= Math.PI*2; if(d < -Math.PI) d += Math.PI*2; return a + d*t; }
const clock = new THREE.Clock();
function updateBot(dt){
  const k = 1 - Math.pow(.0005, dt);
  let mx = 0, mz = 0, steer = false;
  if(state === 'map') flyShip(dt, k);
  if((state === 'stars' || state === 'gather') && !busy){ mx = (keys.right?1:0)-(keys.left?1:0); mz = (keys.down?1:0)-(keys.up?1:0); steer = true; }
  else if((state === 'catch' || state === 'apples' || state === 'dodge') && !busy){ mx = (keys.right?1:0)-(keys.left?1:0); steer = mx !== 0; if(Math.abs(bot.position.z) > .1) mz = -Math.sign(bot.position.z); else bot.position.z = 0; }
  else if(state !== 'start' && state !== 'map'){ const d = Math.hypot(bot.position.x, bot.position.z); if(d > .1){ mx = -bot.position.x/d; mz = -bot.position.z/d; } else { bot.position.x = bot.position.z = 0; } }
  const moving = mx !== 0 || mz !== 0;
  if(moving){
    const l = Math.hypot(mx,mz); bot.position.x += mx/l*4.2*dt; bot.position.z += mz/l*4.2*dt;
    const r = Math.hypot(bot.position.x, bot.position.z); if(r > 6.3){ bot.position.x *= 6.3/r; bot.position.z *= 6.3/r; }
    facing = lerpAngle(facing, Math.atan2(mx,mz), k);
    if(steer) lastAction = T;
  } else facing = lerpAngle(facing, state === 'hurdles' ? Math.PI/2 : 0, k*.5);
  walk = lerp(walk, moving || (state === 'hurdles' && !busy) ? 1 : 0, k);
  if(state === 'finale' && onGround){ vy = 6.5; onGround = false; }
  if(state !== 'map' && (!onGround || vy > 0)){ vy -= 24*dt; bot.position.y += vy*dt; if(bot.position.y <= 0){ bot.position.y = 0; vy = 0; onGround = true; } }
  spin = Math.max(0, spin - dt*9);
  bot.rotation.y = facing + spin + (state === 'finale' ? Math.sin(T*3)*.6 : 0);
  const sw = Math.sin(T*14)*.7*walk;
  legs[0].rotation.x = sw; legs[1].rotation.x = -sw;
  body.position.y = .95 + Math.sin(T*2.2)*.025 + Math.abs(sw)*.03;
  if(happy > 0 && happy < 900) happy -= dt;
  const up = happy > 0;
  arms.forEach(a => {
    const s = a.userData.s; let z = s*(up ? 2.6 + Math.sin(T*12)*.25 : .25);
    if(state === 'start' && s > 0) z = 2.3 + Math.sin(T*7)*.45;
    a.rotation.z = lerp(a.rotation.z, z, k); a.rotation.x = up ? 0 : -s*sw*.8;
  });
  eyes.forEach(e => e.visible = !up); smiles.forEach(e => e.visible = up);
  nextBlink -= dt; if(nextBlink < 0){ blink = .13; nextBlink = rnd(2,4.5); }
  blink = Math.max(0, blink - dt);
  eyes.forEach(e => e.scale.y = blink > 0 ? .012 : .1);
  const look = mode === 'pop' || mode === 'colorclick' || mode === 'picclick' || mode === 'sizeclick' || mode === 'flyclick' || mode === 'memory' || state === 'start' || state === 'map';
  head.rotation.y = lerp(head.rotation.y, look ? ndc.x*.6 : 0, k);
  head.rotation.x = lerp(head.rotation.x, (look ? -ndc.y*.3 : (state === 'catch' || state === 'apples' || state === 'more' || mode === 'count' || mode === 'voice' ? -.35 : 0)) + (talking ? Math.sin(T*11)*.07 : 0), k);
  head.rotation.z = talking ? Math.sin(T*6)*.05 : lerp(head.rotation.z, 0, k);
  antenna.scale.setScalar(talking ? .1 + Math.abs(Math.sin(T*14))*.05 : .1);
  chest.material.emissiveIntensity = .6 + Math.sin(T*3)*.3;
  blob.position.set(bot.position.x, .02, bot.position.z); blob.scale.setScalar(Math.max(.4, 1 - bot.position.y*.25));
}
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05); T += dt;
  clouds.forEach(c => { c.position.x += c.userData.v*dt; if(c.position.x > 24) c.position.x = -24; });
  if(mapGroup.visible) planets.forEach(p => {
    p.s = lerp(p.s, p.i === sel ? 1.25 : 1, .15); p.g.scale.setScalar(p.s*.68);
    p.g.position.y = p.y + Math.sin(T*1.2 + p.i)*.12; p.ball.rotation.y += dt*.5;
  });
  if(state === 'rise'){
    balloons.filter(b => b.rise && (b.base.y += b.rise*dt) > 5.9).forEach(b => { balloons = balloons.filter(x => x !== b); scene.remove(b.g); if(!busy) spawnRiser(); });
  }
  if(state === 'light' && !busy && T > lightT){
    if(lightGreen){ setLight(false); lightT = T + rnd(2,3.5); }
    else { setLight(true); lightT = T + 3.4; tone(990,.15,'sine',.2); say('Zeleno! Kreni!'); }
  }
  balloons.forEach(b => {
    b.s = lerp(b.s, b === hovered ? 1.25 : 1, .2);
    b.g.scale.setScalar(lerp(b.g.scale.x, b.s*b.size, .12));
    b.g.position.set(b.base.x + Math.sin(T*.8+b.ph)*.25, b.base.y + Math.sin(T*1.5+b.ph)*.25, b.base.z);
    b.shake = Math.max(0, b.shake - dt);
    b.g.rotation.z = Math.sin(T*1.2+b.ph)*.1 + Math.sin(T*45)*.5*b.shake;
  });
  if(star.visible){
    star.rotation.y += dt*2.5;
    star.scale.setScalar(lerp(star.scale.x, starActive && state !== 'apples' && state !== 'dodge' ? 1 + Math.sin(T*5)*.08 : .01, .15));
    if(state === 'stars') star.position.y = 1 + Math.sin(T*3)*.15;
    if((state === 'catch' || state === 'apples' || state === 'dodge') && starActive) star.position.y -= (state === 'dodge' ? 2.1 : 1.9)*dt;
  }
  if(state === 'gather' && !busy) countStars.forEach(s => {
    if(s.visible && Math.hypot(bot.position.x - s.position.x, bot.position.z - s.position.z) < 1){ s.visible = false; addStar(s.position); }
  });
  pics.forEach(p => { if(p.sp.visible){
    p.shake = Math.max(0, p.shake - dt);
    p.sp.scale.setScalar(lerp(p.sp.scale.x, p.size*(p === hoveredPic ? 1.2 : 1), .15));
    if(p.mole && T > p.mole && state === 'aliens' && !busy){ spawnAlien(); return; }
    if(p.rocket){ p.base.y += 5*dt; p.base.x += dt; }
    if(p.follow){ p.sp.position.set(star.position.x, star.position.y, .3); p.sp.material.rotation = Math.sin(T*4)*.3; }
    else if(p.fly){ const f = p.fly; p.sp.position.set(f.cx + Math.cos(T*f.v+f.ph)*f.rx, f.cy + Math.sin(T*f.v*1.7+f.ph)*f.ry, .5); p.sp.material.rotation = Math.sin(T*9+f.ph)*.25; }
    else { p.sp.position.set(p.base.x, p.base.y + Math.sin(T*1.5+p.ph)*.15, p.base.z); p.sp.material.rotation = Math.sin(T*45)*.5*p.shake; }
  } });
  if(state === 'hurdles' && logOn && !busy){
    log.position.x -= 3.6*dt;
    const dx = log.position.x - bot.position.x;
    $('#spaceBtn').classList.toggle('pulse', dx > 1 && dx < 2.8);
    if(!logScored && Math.abs(dx) < .6 && bot.position.y < .45){
      logScored = true; logOn = false; log.visible = false; burst(log.position, 0x9a6a44, 10, 3);
      spin = Math.PI*2; sfx.oops();
      if(bonks++ % 2 === 0) say('Ups! Pritisni dugu tipku kad balvan dođe blizu!');
      later(rollLog, 1300);
    } else if(!logScored && dx < -.8){
      logScored = true; addStar(new THREE.Vector3(bot.position.x, 2.6, 0));
    }
    if(logOn && log.position.x < -8){ logOn = false; log.visible = false; if(count < GOAL) later(rollLog, 500); }
  }
  countStars.forEach((s,i) => { if(s.visible){ s.rotation.y += dt*2; s.position.y = s.userData.y + Math.sin(T*3+i)*.08; s.scale.setScalar(lerp(s.scale.x, s.userData.sz, .15)); } });
  updateBot(dt);
  if(starActive && !busy){
    if(state === 'stars' && Math.hypot(bot.position.x-star.position.x, bot.position.z-star.position.z) < 1){
      starActive = false; starBlob.visible = false; addStar(star.position);
      if(count < GOAL) later(placeStar, 500);
    }
    if(state === 'jump' && bot.position.y > 1.45){
      starActive = false; addStar(star.position);
      if(count < GOAL) later(skyStar, 1000);
    }
    if(state === 'dodge'){   // komet: zvjezdica za svaki koji promasi Bibu
      if(star.position.y < 2.6 && star.position.y > .9 && Math.abs(bot.position.x - star.position.x) < 1){
        starActive = false; starBlob.visible = false; pics[7].sp.visible = false; sfx.oops(); spin = Math.PI*2; burst(star.position, 0xff8a1f, 10, 3);
        if(misses++ % 2 === 0) say('Ups! Makni se!');
        later(dropStar, 1000);
      } else if(star.position.y < .5){
        starActive = false; starBlob.visible = false; pics[7].sp.visible = false; burst(star.position, 0xffffff, 8, 2);
        addStar(star.position);
        if(count < GOAL) later(dropStar, 800);
      }
    }
    if(state === 'catch' || state === 'apples'){
      if(star.position.y < 2.8 && star.position.y > .9 && Math.abs(bot.position.x - star.position.x) < 1.15){
        starActive = false; starBlob.visible = false; pics[7].sp.visible = false;
        addStar(star.position, state === 'apples' && count % 2 === 0 ? 'Njam njam!' : null);
        if(count < GOAL) later(dropStar, 900);
      } else if(star.position.y < .5){
        starActive = false; starBlob.visible = false; pics[7].sp.visible = false; sfx.oops(); burst(star.position, 0xffffff, 8, 2);
        if(misses++ % 2 === 0) say('Ups! Probaj opet!');
        later(dropStar, 900);
      }
    }
  }
  if(state === 'finale' && T > nextConfetti){ burst(new THREE.Vector3(rnd(-5,5), rnd(3,6), rnd(-1,2)), null, 16, 5); nextConfetti = T + .35; }
  if((LEVELS.includes(state) || state === 'map') && !busy && T - lastAction > 12){ say(hint()); lastAction = T; }
  for(let i = parts.length-1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; p.v.y -= 9*dt;
    p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += dt*8; p.m.rotation.y += dt*6;
    p.m.scale.setScalar(Math.min(1, Math.max(.01, p.life*2)));
    if(p.life <= 0){ scene.remove(p.m); parts.splice(i,1); }
  }
  renderer.render(scene, camera);
}
tick();
})();
</script>
