<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}</style>
</head>
<body>
<title>Teo i Bibo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: 3D otok preko cijelog zaslona; zvjezdice i razine gore, Bibin oblacic ispod njih, tipke-pomoc dolje. */
:root{
  --sky-top:#3fa9ff; --sky-bottom:#cdf2ff;
  --paper:#ffffff; --ink:#1d2a4d;
  --accent:#ff8a1f; --accent-ink:#ffffff;
  --go:#2fbf5b; --gold:#ffc928;
  --slot:rgba(29,42,77,.22); --shadow:rgba(20,40,90,.28);
  --font:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky-top:#0b1440; --sky-bottom:#4a3a8c; --paper:#1c2550; --ink:#f2f5ff;
  --slot:rgba(255,255,255,.25); --shadow:rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --sky-top:#0b1440; --sky-bottom:#4a3a8c; --paper:#1c2550; --ink:#f2f5ff;
  --slot:rgba(255,255,255,.25); --shadow:rgba(0,0,0,.5); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{
  background:linear-gradient(var(--sky-top),var(--sky-bottom)) fixed;
  color:var(--ink); font-family:var(--font); overflow:hidden;
  touch-action:none; user-select:none; -webkit-user-select:none;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24'><path d='M4 2l15 9-7 1.5L9 20z' fill='%23ff8a1f' stroke='white' stroke-width='1.8' stroke-linejoin='round'/></svg>") 8 4, auto;
}
button{font-family:inherit; cursor:inherit; border:0; color:inherit}
button:focus-visible{outline:4px solid var(--gold); outline-offset:3px}
#c{position:fixed; inset:0; width:100%; height:100%; display:block}

#hud,#start,#again{
  position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; align-items:center;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
}
#hud{justify-content:space-between}
#top{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.pill{background:var(--paper); border-radius:999px; box-shadow:0 6px 0 var(--shadow); padding:6px 16px; display:flex; gap:8px; align-items:center}
#levels span{font-size:clamp(22px,3.2vw,34px); opacity:.3; transition:.3s; display:inline-block}
#levels span.on{opacity:1; transform:scale(1.25)}
#slots span{font-size:clamp(30px,4.6vw,52px); line-height:1; color:var(--slot); transition:color .2s}
#slots span.on{color:var(--gold); animation:pop .5s}
@keyframes pop{0%{transform:scale(.3) rotate(-40deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
#tools{display:flex; gap:8px}
#tools button{pointer-events:auto; width:44px; height:44px; border-radius:50%; background:var(--paper); font-size:20px; box-shadow:0 4px 0 var(--shadow)}

#bubble{
  align-self:center; max-width:min(92%,640px); background:var(--paper); color:var(--ink);
  font-size:clamp(17px,2.3vw,26px); font-weight:700; line-height:1.25; text-align:center; text-wrap:balance;
  padding:10px 22px; border-radius:26px; box-shadow:0 6px 0 var(--shadow); margin-top:10px;
}
#mid{flex:1}
#controls{display:flex; align-items:flex-end; justify-content:center; min-height:150px}
#mouseHint{font-size:clamp(48px,7vw,80px); animation:bob 1s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-14px) rotate(-8deg)}}
#pad{display:grid; grid-template-columns:repeat(3,auto); gap:8px; justify-items:center}
#pad button,#spaceBtn{
  pointer-events:auto; background:var(--paper); color:var(--ink); font-weight:800;
  border-radius:16px; box-shadow:0 7px 0 var(--shadow); transition:transform .08s, background .08s, box-shadow .08s;
}
#pad button{width:clamp(56px,7vw,76px); height:clamp(56px,7vw,76px); font-size:clamp(24px,3vw,34px)}
#pad button[data-k="up"]{grid-column:2}
#pad button[data-k="left"]{grid-column:1}
#spaceBtn{width:min(70vw,460px); height:clamp(60px,8vw,80px); font-size:clamp(20px,2.6vw,28px); letter-spacing:.12em}
#pad button.on,#spaceBtn.on{background:var(--accent); color:var(--accent-ink); transform:translateY(6px); box-shadow:0 1px 0 var(--shadow)}
.pulse{animation:pulse 1s infinite alternate ease-in-out}
@keyframes pulse{to{transform:scale(1.08)}}

#start{justify-content:space-between; text-align:center}
#start h1{margin:0; font-size:clamp(44px,9vw,110px); font-weight:800; line-height:1; color:var(--accent-ink);
  -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 7px 0 var(--shadow)}
#start h1 b{color:var(--gold)}
#start .bottom{display:flex; flex-direction:column; align-items:center; gap:12px}
#play,#replay{
  pointer-events:auto; width:clamp(110px,16vw,170px); height:clamp(110px,16vw,170px); border-radius:50%;
  background:var(--go); color:var(--accent-ink); font-size:clamp(54px,8vw,90px); line-height:1;
  box-shadow:0 10px 0 var(--shadow); border:6px solid var(--accent-ink);
}
#start p{margin:0; font-size:15px; font-weight:500; background:var(--paper); padding:6px 16px; border-radius:16px; max-width:560px}
#again{justify-content:flex-end; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#replay{background:var(--accent)}
@media (prefers-reduced-motion: reduce){ .pulse,#mouseHint,#slots span.on{animation:none} }
</style>

<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div id="levels" class="pill"><span data-l="balloons">🎈</span><span data-l="stars">⭐</span><span data-l="jump">🚀</span></div>
    <div id="slots" class="pill"></div>
    <div id="tools">
      <button id="mute" aria-label="Zvuk uključen ili isključen">🔊</button>
      <button id="full" aria-label="Cijeli zaslon">⛶</button>
    </div>
  </div>
  <div id="bubble" hidden></div>
  <div id="mid"></div>
  <div id="controls">
    <div id="mouseHint" hidden>🖱️</div>
    <div id="pad" hidden>
      <button data-k="up" aria-label="Gore">▲</button>
      <button data-k="left" aria-label="Lijevo">◀</button>
      <button data-k="down" aria-label="Dolje">▼</button>
      <button data-k="right" aria-label="Desno">▶</button>
    </div>
    <button id="spaceBtn" hidden>RAZMAK</button>
  </div>
</div>

<div id="start">
  <h1>Teo <b>i</b> Bibo</h1>
  <div class="bottom">
    <button id="play" class="pulse" aria-label="Kreni">▶</button>
    <p>Za roditelje: uključite zvuk. Bibo govori hrvatski ako uređaj ima hrvatski glas, inače pijuče i piše u oblačiću.</p>
  </div>
</div>

<div id="again" hidden><button id="replay" class="pulse" aria-label="Igraj opet">↻</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const NAME = 'Teo';          // ime djeteta koje Bibo izgovara
const GOAL = 5;              // zvjezdica po zadatku
const $ = s => document.querySelector(s);
const canvas = $('#c');

/* ---------- scena ---------- */
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
function resize(){
  const w = window.innerWidth||800, h = window.innerHeight||600, a = w/h;
  renderer.setSize(w, h, false);
  camera.aspect = a;
  camera.position.set(0, 5.4, Math.min(34, a < 1.5 ? 13*1.5/a : 13));
  camera.lookAt(0, 1.9, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0x7fbf6a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(5,10,7); scene.add(sun);

const mats = {};
function mat(color, o){ const k = color+JSON.stringify(o||{}); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({color, roughness:.55, metalness:.05}, o||{}))); }
function glow(color){ return mat(color, {emissive:color, emissiveIntensity:.9}); }
function mesh(geo, m, x,y,z, parent){ const o = new THREE.Mesh(geo, m); o.position.set(x||0,y||0,z||0); (parent||scene).add(o); return o; }
const SPH = new THREE.SphereGeometry(1, 28, 20);
const rnd = (a,b) => a + Math.random()*(b-a);

/* otok */
mesh(new THREE.CylinderGeometry(7.2,7.2,.6,56), mat(0x6fd35b), 0,-.3,0);
mesh(new THREE.CylinderGeometry(7.25,6.6,.5,56), mat(0x4fae45), 0,-.75,0);
const under = mesh(new THREE.ConeGeometry(6.6,5,40), mat(0x9a6a44), 0,-3.5,0); under.rotation.x = Math.PI;
for(let i=0;i<26;i++){ // cvijece
  const a = rnd(0,Math.PI*2), r = rnd(2.2,6.8), x = Math.cos(a)*r, z = Math.sin(a)*r;
  mesh(new THREE.CylinderGeometry(.03,.03,.3,6), mat(0x3d9140), x,.15,z);
  const f = mesh(SPH, mat([0xff6f91,0xffd23f,0xffffff,0xb388ff,0xff9f43][i%5]), x,.34,z); f.scale.set(.13,.09,.13);
}
[[-5.4,-3.2,1.2],[5.2,-3.6,1.4],[-2.6,-5.6,1],[2.9,-5.4,.9],[6.2,-.4,.8],[-6.3,-.2,.8]].forEach(([x,z,s])=>{ // drvece
  mesh(new THREE.CylinderGeometry(.18*s,.24*s,1.2*s,10), mat(0x8a5a35), x,.6*s,z);
  const c1 = mesh(SPH, mat(0x2fa35a), x,1.7*s,z); c1.scale.set(.95*s,.85*s,.95*s);
  const c2 = mesh(SPH, mat(0x3fbf6a), x+.3*s,2.3*s,z); c2.scale.set(.6*s,.55*s,.6*s);
});
const clouds = [];
for(let i=0;i<7;i++){
  const g = new THREE.Group();
  for(let j=0;j<4;j++){ const p = mesh(SPH, mat(0xffffff,{roughness:1}), j*.9-1.3, rnd(-.15,.25), rnd(-.3,.3), g); const s = rnd(.6,1); p.scale.set(s,s*.7,s); }
  g.position.set(rnd(-20,20), rnd(3,10), rnd(-22,-9)); g.userData.v = rnd(.15,.5); scene.add(g); clouds.push(g);
}

/* ---------- robot Bibo ---------- */
const WHITE = mat(0xffffff,{roughness:.3}), ORANGE = mat(0xff8a1f,{roughness:.4}), DARK = mat(0x18203f,{roughness:.15, metalness:.3});
const bot = new THREE.Group(); scene.add(bot);
const body = mesh(SPH, WHITE, 0,.95,0, bot); body.scale.set(.5,.55,.45);
const chest = mesh(SPH, glow(0x4de8ff), 0,1.0,.42, bot); chest.scale.set(.1,.1,.05);
const scarf = mesh(new THREE.TorusGeometry(.32,.09,10,24), ORANGE, 0,1.42,0, bot); scarf.rotation.x = Math.PI/2;
const head = new THREE.Group(); head.position.set(0,1.85,0); bot.add(head);
const skull = mesh(SPH, WHITE, 0,0,0, head); skull.scale.set(.58,.48,.5);
const visor = mesh(SPH, DARK, 0,0,.2, head); visor.scale.set(.44,.3,.33);
const EYE = glow(0x4de8ff);
const eyes = [-1,1].map(s => { const e = mesh(SPH, EYE, s*.16,.01,.5, head); e.scale.set(.075,.1,.04); return e; });
const smiles = [-1,1].map(s => { const e = mesh(new THREE.TorusGeometry(.08,.028,8,16,Math.PI), EYE, s*.16,-.02,.52, head); e.visible = false; return e; });
[-1,1].forEach(s => { const ear = mesh(new THREE.CylinderGeometry(.14,.14,.12,16), ORANGE, s*.6,0,0, head); ear.rotation.z = Math.PI/2; });
mesh(new THREE.CylinderGeometry(.025,.025,.35,8), mat(0x8891aa), 0,.62,0, head);
const antenna = mesh(SPH, glow(0xff8a1f), 0,.84,0, head); antenna.scale.setScalar(.1);
const arms = [-1,1].map(s => {
  const p = new THREE.Group(); p.position.set(s*.5,1.25,0); bot.add(p);
  mesh(new THREE.CylinderGeometry(.08,.08,.45,10), WHITE, 0,-.22,0, p);
  const h = mesh(SPH, ORANGE, 0,-.52,0, p); h.scale.setScalar(.13);
  p.userData.s = s; return p;
});
const legs = [-1,1].map(s => {
  const p = new THREE.Group(); p.position.set(s*.2,.48,0); bot.add(p);
  mesh(new THREE.CylinderGeometry(.09,.09,.3,10), WHITE, 0,-.18,0, p);
  const f = mesh(SPH, ORANGE, 0,-.38,.06, p); f.scale.set(.15,.1,.22);
  return p;
});
const blob = mesh(new THREE.CircleGeometry(.6,24), new THREE.MeshBasicMaterial({color:0x103010, transparent:true, opacity:.28, depthWrite:false}), 0,.02,0);
blob.rotation.x = -Math.PI/2;

/* ---------- zvjezdica, baloni, konfeti ---------- */
function starGeo(){
  const s = new THREE.Shape();
  for(let i=0;i<10;i++){ const r = i%2 ? .23 : .52, a = i/10*Math.PI*2 + Math.PI/2, x = Math.cos(a)*r, y = Math.sin(a)*r; i ? s.lineTo(x,y) : s.moveTo(x,y); }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth:.16, bevelEnabled:true, bevelThickness:.05, bevelSize:.05, bevelSegments:2});
  g.center(); return g;
}
const star = mesh(starGeo(), mat(0xffc928,{emissive:0xffa000, emissiveIntensity:.5, roughness:.3}), 0,1,0);
star.visible = false;
const starBlob = mesh(new THREE.CircleGeometry(.4,20), blob.material, 0,.02,0); starBlob.rotation.x = -Math.PI/2; starBlob.visible = false;

const BCOL = [0xff4d6d,0xffc928,0x3ecf8e,0x4d9bff,0xb86bff];
const HIT = new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false});
let balloons = [];
function spawnBalloons(){
  balloons.forEach(b => scene.remove(b.g)); balloons = [];
  const xs = [-5,-2.6,0,2.6,5].sort(()=>Math.random()-.5);
  for(let i=0;i<GOAL;i++){
    const g = new THREE.Group(), col = BCOL[i%BCOL.length];
    const b = mesh(SPH, mat(col,{roughness:.2}), 0,0,0, g); b.scale.set(.6,.72,.6);
    const k = mesh(new THREE.ConeGeometry(.1,.16,10), mat(col), 0,-.76,0, g);
    mesh(new THREE.CylinderGeometry(.012,.012,1.1,4), mat(0xffffff), 0,-1.38,0, g);
    const hit = mesh(SPH, HIT, 0,-.05,0, g); hit.scale.setScalar(1.0);
    const x = xs[i] + rnd(-.4,.4);
    const base = new THREE.Vector3(x, Math.abs(x) < 1.2 ? rnd(4.6,5.3) : rnd(2.7,5), rnd(-1,1.2));
    g.position.copy(base); g.scale.setScalar(.01); scene.add(g);
    balloons.push({g, hit, base, ph:rnd(0,6), col, s:1});
  }
}
const BOX = new THREE.BoxGeometry(.13,.13,.04);
let parts = [];
function burst(pos, col, n, power){
  for(let i=0;i<n;i++){
    const m = mesh(BOX, mat(col || BCOL[i%5]), pos.x,pos.y,pos.z);
    const a = rnd(0,Math.PI*2), u = rnd(-.3,1), p = (power||4)*rnd(.5,1);
    parts.push({m, v:new THREE.Vector3(Math.cos(a)*p, u*p+2, Math.sin(a)*p*.6), life:rnd(.8,1.5)});
  }
  while(parts.length > 220){ scene.remove(parts.shift().m); }
}

/* ---------- zvuk i govor ---------- */
let ac = null, muted = false;
function tone(f, d, type, v, when, f2){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when||0);
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(v||.2, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
const sfx = {
  pop(){ tone(720,.14,'triangle',.35,0,140); },
  ding(){ tone(880,.18,'sine',.25); tone(1320,.3,'sine',.25,.1); },
  jump(){ tone(300,.25,'sine',.2,0,820); },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.25,i*.14)); },
  giggle(){ [900,1100,900,1200].forEach((f,i)=>tone(f,.08,'square',.08,i*.09)); },
  beeps(n){ for(let i=0;i<n;i++) tone(rnd(500,1100),.07,'square',.06,i*.11); }
};
let voice = null, talking = false, talkTimer = 0, sayId = 0;
const synth = window.speechSynthesis;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices(); voice = null;
  for(const p of ['hr','bs','sr','sl']){ const v = vs.find(v => (v.lang||'').toLowerCase().startsWith(p)); if(v){ voice = v; return; } }
}
if(synth){ pickVoice(); try{ synth.addEventListener('voiceschanged', pickVoice); }catch(e){} }
const bubble = $('#bubble');
function say(text){
  bubble.textContent = text; bubble.hidden = false;
  clearTimeout(talkTimer);
  const id = ++sayId, ms = 700 + text.length*65;
  talking = true;
  if(!muted && voice && synth){
    try{
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice; u.lang = voice.lang; u.pitch = 1.6; u.rate = .95;
      u.onend = u.onerror = () => { if(id === sayId) talking = false; };
      setTimeout(() => { if(id === sayId) synth.speak(u); }, 70);
    }catch(e){}
    talkTimer = setTimeout(() => { if(id === sayId) talking = false; }, ms + 4000);
  } else {
    if(!muted) sfx.beeps(Math.min(9, Math.ceil(text.length/7)));
    talkTimer = setTimeout(() => { if(id === sayId) talking = false; }, ms);
  }
}
const PRAISE = ['Bravo, '+NAME+'!','Super!','Tako je!','Odlično, '+NAME+'!','Jupi!','Ti si majstor!','Fantastično!','To, '+NAME+'!'];
let lastPraise = -1;
function praise(){ let i; do{ i = Math.floor(Math.random()*PRAISE.length); }while(i === lastPraise); lastPraise = i; say(PRAISE[i]); }

/* ---------- stanje igre ---------- */
let state = 'start', count = 0, round = 0, T = 0, lastAction = 0, busy = false;
let vy = 0, onGround = true, happy = 0, spin = 0, facing = 0, walk = 0, nextBlink = 2, blink = 0;
let starActive = false, nextConfetti = 0, hovered = null;
const keys = {up:false, down:false, left:false, right:false};
const slotsEl = $('#slots'); const slots = [];
for(let i=0;i<GOAL;i++){ const s = document.createElement('span'); s.textContent = '★'; slotsEl.appendChild(s); slots.push(s); }
const HINT = {
  balloons:'Pomakni strelicu na balon i klikni!',
  stars:'Pritisni strelice na tipkovnici i dovedi me do zvjezdice!',
  jump:'Pritisni veliku dugu tipku da skočim!'
};
function setLevel(l){
  state = l; count = 0; busy = false; lastAction = T;
  slots.forEach(s => s.classList.remove('on'));
  document.querySelectorAll('#levels span').forEach(s => s.classList.toggle('on', s.dataset.l === l));
  $('#mouseHint').hidden = l !== 'balloons';
  $('#pad').hidden = l !== 'stars';
  $('#spaceBtn').hidden = l !== 'jump';
  $('#again').hidden = true;
  star.visible = starBlob.visible = starActive = false;
  if(l === 'balloons'){
    spawnBalloons();
    say(round === 0 ? 'Bok, '+NAME+'! Ja sam Bibo, tvoj robot prijatelj. Vidiš li balone? Pomakni strelicu na balon i klikni!' : 'Idemo opet, '+NAME+'! Klikni na balone!');
  } else if(l === 'stars'){
    placeStar(); say('Bravo! Sada mi pomozi doći do zvjezdice. Pritisni strelice na tipkovnici!');
  } else if(l === 'jump'){
    setTimeout(() => { if(state === 'jump') skyStar(); }, 900);
    say('Odlično! Zvjezdica je visoko. Pritisni veliku dugu tipku da skočim!');
  } else if(l === 'finale'){
    sfx.fanfare(); happy = 999;
    say('Bravo, '+NAME+'! Skupio si sve zvjezdice! Ti si pravi prvak!');
    setTimeout(() => { if(state === 'finale') $('#again').hidden = false; }, 3500);
  }
}
function addStar(pos){
  if(busy) return;
  count++; slots[count-1].classList.add('on'); sfx.ding(); happy = Math.max(happy, 1.3); lastAction = T;
  if(pos) burst(pos, 0xffc928, 14, 4);
  if(count >= GOAL){
    busy = true;
    const next = {balloons:'stars', stars:'jump', jump:'finale'}[state];
    setTimeout(() => setLevel(next), 1300);
  } else praise();
}
function placeStar(){
  let x, z, n = 0;
  do{ const a = rnd(0,Math.PI*2), r = rnd(2.4,5.4); x = Math.cos(a)*r; z = Math.sin(a)*r*.8; n++; }
  while(Math.hypot(x-bot.position.x, z-bot.position.z) < 3 && n < 30);
  star.position.set(x,1,z); star.scale.setScalar(.01); star.visible = starBlob.visible = true; starActive = true;
  starBlob.position.set(x,.02,z);
}
function skyStar(){ star.position.set(0,4.2,0); star.scale.setScalar(.01); star.visible = true; starBlob.visible = false; starActive = true; }
function jump(){
  if(state === 'start' || !onGround) return;
  vy = 9.8; onGround = false; sfx.jump(); lastAction = T;
}
function tickle(){ spin = Math.PI*2; happy = Math.max(happy,1.5); sfx.giggle(); say('Hi hi hi! To škaklja!'); lastAction = T; }
function popBalloon(b){
  balloons = balloons.filter(x => x !== b); scene.remove(b.g); hovered = null;
  sfx.pop(); burst(b.g.position, b.col, 18, 5); addStar();
}

/* ---------- unos ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(0,0);
function setNdc(e){ const r = canvas.getBoundingClientRect(); ndc.x = (e.clientX-r.left)/r.width*2-1; ndc.y = -(e.clientY-r.top)/r.height*2+1; }
function pickBalloon(){
  if(state !== 'balloons' || !balloons.length) return null;
  scene.updateMatrixWorld();
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(balloons.map(b => b.hit), false);
  return h.length ? balloons.find(b => b.hit === h[0].object) : null;
}
canvas.addEventListener('pointermove', e => { setNdc(e); hovered = pickBalloon(); });
canvas.addEventListener('pointerdown', e => {
  if(state === 'start') return;
  setNdc(e);
  const b = pickBalloon();
  if(b){ popBalloon(b); return; }
  ray.setFromCamera(ndc, camera);
  if(ray.intersectObject(bot, true).length) tickle();
});
const KEYMAP = {ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'};
function padBtn(k){ return document.querySelector('#pad button[data-k="'+k+'"]'); }
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if(state === 'start'){ if(e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); begin(); } return; }
  if(k){ e.preventDefault(); keys[k] = true; padBtn(k).classList.add('on'); }
  if(e.code === 'Space'){ e.preventDefault(); $('#spaceBtn').classList.add('on'); if(!e.repeat) jump(); }
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if(k){ keys[k] = false; padBtn(k).classList.remove('on'); }
  if(e.code === 'Space') $('#spaceBtn').classList.remove('on');
});
window.addEventListener('blur', () => { for(const k in keys){ keys[k] = false; padBtn(k).classList.remove('on'); } });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; b.classList.remove('on'); }));
});
$('#spaceBtn').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
$('#mute').addEventListener('click', () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; if(muted && synth) synth.cancel(); });
$('#full').addEventListener('click', () => {
  try{ if(document.fullscreenElement) document.exitFullscreen(); else { const p = document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(()=>{}); } }catch(e){}
});
if(!document.fullscreenEnabled) $('#full').hidden = true;
function begin(){
  if(state !== 'start') return;
  $('#start').hidden = true; $('#hud').hidden = false; pickVoice();
  tone(660,.1,'sine',.15); setLevel('balloons');
}
$('#play').addEventListener('click', begin);
$('#replay').addEventListener('click', () => { round++; happy = 0; setLevel('balloons'); });

/* ---------- petlja ---------- */
const lerp = (a,b,t) => a + (b-a)*t;
function lerpAngle(a,b,t){ let d = (b-a) % (Math.PI*2); if(d > Math.PI) d -= Math.PI*2; if(d < -Math.PI) d += Math.PI*2; return a + d*t; }
const clock = new THREE.Clock();
function updateBot(dt){
  const k = 1 - Math.pow(.0005, dt);
  let mx = 0, mz = 0;
  if(state === 'stars' && !busy){ mx = (keys.right?1:0)-(keys.left?1:0); mz = (keys.down?1:0)-(keys.up?1:0); }
  else if(state !== 'start'){ const d = Math.hypot(bot.position.x, bot.position.z); if(d > .1){ mx = -bot.position.x/d; mz = -bot.position.z/d; } else { bot.position.x = bot.position.z = 0; } }
  const moving = mx !== 0 || mz !== 0;
  if(moving){
    const l = Math.hypot(mx,mz); bot.position.x += mx/l*4.2*dt; bot.position.z += mz/l*4.2*dt;
    const r = Math.hypot(bot.position.x, bot.position.z); if(r > 6.3){ bot.position.x *= 6.3/r; bot.position.z *= 6.3/r; }
    facing = lerpAngle(facing, Math.atan2(mx,mz), k);
    if(state === 'stars') lastAction = T;
  } else facing = lerpAngle(facing, 0, k*.5);
  walk = lerp(walk, moving ? 1 : 0, k);
  if(state === 'finale' && onGround){ vy = 6.5; onGround = false; }
  if(!onGround || vy > 0){ vy -= 24*dt; bot.position.y += vy*dt; if(bot.position.y <= 0){ bot.position.y = 0; vy = 0; onGround = true; } }
  spin = Math.max(0, spin - dt*9);
  bot.rotation.y = facing + spin + (state === 'finale' ? Math.sin(T*3)*.6 : 0);
  const sw = Math.sin(T*14)*.7*walk;
  legs[0].rotation.x = sw; legs[1].rotation.x = -sw;
  body.position.y = .95 + Math.sin(T*2.2)*.025 + Math.abs(sw)*.03;
  if(happy > 0 && happy < 900) happy -= dt;
  const up = happy > 0;
  arms.forEach(a => {
    const s = a.userData.s; let z = s*(up ? 2.6 + Math.sin(T*12)*.25 : .25);
    if(state === 'start' && s > 0) z = 2.3 + Math.sin(T*7)*.45;
    a.rotation.z = lerp(a.rotation.z, z, k); a.rotation.x = up ? 0 : -s*sw*.8;
  });
  eyes.forEach(e => e.visible = !up); smiles.forEach(e => e.visible = up);
  nextBlink -= dt; if(nextBlink < 0){ blink = .13; nextBlink = rnd(2,4.5); }
  blink = Math.max(0, blink - dt);
  eyes.forEach(e => e.scale.y = blink > 0 ? .012 : .1);
  const look = state === 'balloons' || state === 'start';
  head.rotation.y = lerp(head.rotation.y, look ? ndc.x*.6 : 0, k);
  head.rotation.x = lerp(head.rotation.x, (look ? -ndc.y*.3 : 0) + (talking ? Math.sin(T*11)*.07 : 0), k);
  head.rotation.z = talking ? Math.sin(T*6)*.05 : lerp(head.rotation.z, 0, k);
  antenna.scale.setScalar(talking ? .1 + Math.abs(Math.sin(T*14))*.05 : .1);
  chest.material.emissiveIntensity = .6 + Math.sin(T*3)*.3;
  blob.position.set(bot.position.x, .02, bot.position.z); blob.scale.setScalar(Math.max(.4, 1 - bot.position.y*.25));
}
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05); T += dt;
  clouds.forEach(c => { c.position.x += c.userData.v*dt; if(c.position.x > 24) c.position.x = -24; });
  balloons.forEach(b => {
    b.s = lerp(b.s, b === hovered ? 1.25 : 1, .2);
    b.g.scale.setScalar(lerp(b.g.scale.x, b.s, .12));
    b.g.position.set(b.base.x + Math.sin(T*.8+b.ph)*.25, b.base.y + Math.sin(T*1.5+b.ph)*.25, b.base.z);
    b.g.rotation.z = Math.sin(T*1.2+b.ph)*.1;
  });
  if(star.visible){
    star.rotation.y += dt*2.5;
    star.scale.setScalar(lerp(star.scale.x, starActive ? 1 + Math.sin(T*5)*.08 : .01, .15));
    if(state === 'stars') star.position.y = 1 + Math.sin(T*3)*.15;
  }
  updateBot(dt);
  if(starActive && !busy){
    if(state === 'stars' && Math.hypot(bot.position.x-star.position.x, bot.position.z-star.position.z) < 1){
      starActive = false; starBlob.visible = false; addStar(star.position);
      if(count < GOAL) setTimeout(() => { if(state === 'stars') placeStar(); }, 500);
    }
    if(state === 'jump' && bot.position.y > 1.45){
      starActive = false; addStar(star.position);
      if(count < GOAL) setTimeout(() => { if(state === 'jump') skyStar(); }, 1000);
    }
  }
  if(state === 'finale' && T > nextConfetti){ burst(new THREE.Vector3(rnd(-5,5), rnd(3,6), rnd(-1,2)), null, 16, 5); nextConfetti = T + .35; }
  if(HINT[state] && !busy && T - lastAction > 12){ say(HINT[state]); lastAction = T; }
  for(let i = parts.length-1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; p.v.y -= 9*dt;
    p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += dt*8; p.m.rotation.y += dt*6;
    p.m.scale.setScalar(Math.min(1, Math.max(.01, p.life*2)));
    if(p.life <= 0){ scene.remove(p.m); parts.splice(i,1); }
  }
  renderer.render(scene, camera);
}
tick();
})();
</script>
