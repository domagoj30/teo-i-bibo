<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bibin vlak</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Mjerna jedinica --u: stoti dio visine, a na uskim zaslonima dvjestoti dio sirine, da vlak uvijek stane. */
:root{--u:min(1vh,.5vw); --ink:#1b2340; --orange:#ff8a1f}
html,body{margin:0; height:100%; overflow:hidden; font-family:"Baloo 2",system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit; color:inherit; border:0; padding:0; cursor:pointer; background:none}

/* ---------- krajolik ---------- */
#scene{position:fixed; inset:0; overflow:hidden; background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--sky3)); transition:background 1s}
body.t0{--sky1:#6fc3ff; --sky2:#cfeeff; --sky3:#eafbe0; --ground:#62c15c; --ground2:#4ea84c; --sun:#ffd84a}
body.t1{--sky1:#35b6f2; --sky2:#b9efff; --sky3:#e6fbff; --ground:#f4d27e; --ground2:#e0b95f; --sun:#fff06a}
body.t2{--sky1:#6a5acd; --sky2:#ff9e7a; --sky3:#ffd9a8; --ground:#6fae78; --ground2:#588f63; --sun:#ffb347}
#sun{position:absolute; right:calc(var(--u)*14); top:calc(var(--u)*9); width:calc(var(--u)*15); height:calc(var(--u)*15); border-radius:50%; background:var(--sun);
  box-shadow:0 0 0 calc(var(--u)*2.5) #ffffff40, 0 0 0 calc(var(--u)*5.5) #ffffff22; animation:sun 6s ease-in-out infinite}
@keyframes sun{50%{transform:scale(1.06)}}
.cloud{position:absolute; left:100%; width:calc(var(--u)*22); height:calc(var(--u)*7); border-radius:calc(var(--u)*4); background:#fff; opacity:.92; animation:drift linear infinite}
.cloud:before,.cloud:after{content:""; position:absolute; background:#fff; border-radius:50%}
.cloud:before{width:calc(var(--u)*10); height:calc(var(--u)*10); left:calc(var(--u)*3); top:calc(var(--u)*-5)}
.cloud:after{width:calc(var(--u)*8); height:calc(var(--u)*8); left:calc(var(--u)*11); top:calc(var(--u)*-3.4)}
.cloud.a{top:calc(var(--u)*20); animation-duration:70s; animation-delay:-20s}
.cloud.b{top:calc(var(--u)*31); animation-duration:95s; animation-delay:-60s; transform:scale(.7)}
.cloud.c{top:calc(var(--u)*14); animation-duration:120s; animation-delay:-95s; transform:scale(.55)}
@keyframes drift{to{left:calc(var(--u)*-30)}}
.layer{position:absolute; left:0; right:0; background-repeat:repeat-x; background-position:0 0; animation:sc linear infinite; animation-play-state:paused}
#far{bottom:calc(var(--u)*20); height:calc(var(--u)*42); --tw:calc(var(--u)*112); background-size:var(--tw) 100%; animation-duration:11s}
#near{bottom:calc(var(--u)*12); height:calc(var(--u)*30); --tw:calc(var(--u)*80); background-size:var(--tw) 100%; animation-duration:3.4s}
@keyframes sc{to{background-position-x:calc(var(--tw)*-1)}}
#ground{position:absolute; left:0; right:0; bottom:0; height:calc(var(--u)*14); background:linear-gradient(var(--ground),var(--ground2)); transition:background 1s}
#ties{position:absolute; left:0; right:0; bottom:calc(var(--u)*8.2); height:calc(var(--u)*2.6); --tw:calc(var(--u)*7);
  background:repeating-linear-gradient(90deg,#7a5a3c 0,#7a5a3c calc(var(--u)*2.4),transparent calc(var(--u)*2.4),transparent calc(var(--u)*7)); animation:sc .32s linear infinite; animation-play-state:paused}
#rail{position:absolute; left:0; right:0; bottom:calc(var(--u)*10.2); height:calc(var(--u)*1.1); background:#55607a; box-shadow:0 calc(var(--u)*.4) 0 #2c3450}
body.moving .layer, body.moving #ties, body.moving .spin{animation-play-state:running}

/* ---------- vlak ---------- */
#train{position:absolute; left:0; right:0; bottom:calc(var(--u)*10.6); display:flex; align-items:flex-end; justify-content:center; transform:translateX(-140vw); will-change:transform}
#loco{width:calc(var(--u)*38); height:calc(var(--u)*33); flex:none; margin-left:calc(var(--u)*-.6); overflow:visible}
.spin{animation:rot .7s linear infinite; animation-play-state:paused; transform-box:fill-box; transform-origin:center}
@keyframes rot{to{transform:rotate(360deg)}}
#wagons{display:flex; align-items:flex-end}
.wagon{position:relative; width:calc(var(--u)*var(--w)); margin-right:calc(var(--u)*2.6); padding-bottom:calc(var(--u)*3.2); display:flex; flex-direction:column; flex:none; border-radius:calc(var(--u)*2.4)}
.wagon .cargo{box-sizing:border-box; display:flex; flex-wrap:wrap-reverse; justify-content:center; align-content:flex-start; align-items:center; min-height:calc(var(--u)*var(--h));
  border:calc(var(--u)*.9) solid var(--c2); border-bottom:0; border-radius:calc(var(--u)*2.4) calc(var(--u)*2.4) 0 0; background:#ffffff66; margin:0 calc(var(--u)*1.2)}
.wagon .body{height:calc(var(--u)*9); border-radius:calc(var(--u)*2.2); background:linear-gradient(var(--c),var(--c) 62%,var(--c2) 62%); box-shadow:inset 0 calc(var(--u)*.7) 0 #ffffff55;
  display:flex; align-items:center; justify-content:center}
.wagon .plate{background:#fff; border-radius:calc(var(--u)*1.4); padding:0 calc(var(--u)*1.8); font-weight:800; font-size:calc(var(--u)*5.4); line-height:calc(var(--u)*6.6); min-width:calc(var(--u)*3); text-align:center; letter-spacing:calc(var(--u)*.4)}
.wagon .plate:empty{display:none}
.wagon .wh{position:absolute; bottom:0; width:calc(var(--u)*7.4); height:calc(var(--u)*7.4); box-sizing:border-box; border-radius:50%; background:#fff; border:calc(var(--u)*1.5) solid var(--ink)}
.wagon .wh:before{content:""; position:absolute; left:50%; top:8%; width:calc(var(--u)*.9); height:84%; margin-left:calc(var(--u)*-.45); background:var(--ink); border-radius:calc(var(--u))}
.wagon .wh.a{left:12%} .wagon .wh.b{right:12%}
.wagon:after{content:""; position:absolute; right:calc(var(--u)*-2.8); bottom:calc(var(--u)*5.6); width:calc(var(--u)*3); height:calc(var(--u)*1.3); background:var(--ink); border-radius:calc(var(--u))}
.it{width:calc(var(--u)*var(--s)); height:calc(var(--u)*var(--s)); font-size:calc(var(--u)*var(--s)*.74); line-height:calc(var(--u)*var(--s)); text-align:center; display:block; font-family:system-ui,"Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}}
.sil{filter:brightness(0) opacity(.8); transition:filter .5s}
.qm{font-weight:800; color:var(--orange); font-family:inherit}
.it svg,.opt svg{width:78%; height:78%; display:block; margin:11% auto 0} .opt svg{width:66%; height:66%; margin:0}
.sign{position:absolute; top:34%; left:calc(var(--u)*-5.2); transform:translate(-50%,-50%); line-height:1; font-size:calc(var(--u)*12); font-weight:800; color:#fff; text-shadow:0 calc(var(--u)*.5) 0 #00000030}
.wagon.pick{cursor:pointer; transition:transform .15s}
.wagon.pick:hover,.wagon.pick.cur{transform:translateY(calc(var(--u)*-1.4))}
.wagon.pick:hover .cargo,.wagon.pick.cur .cargo{background:#fff}
.puff{position:absolute; width:calc(var(--u)*5); height:calc(var(--u)*5); border-radius:50%; background:#fff; opacity:.9; pointer-events:none; animation:puff 1.5s ease-out forwards}
@keyframes puff{to{transform:translate(calc(var(--u)*-16),calc(var(--u)*-22)) scale(2.6); opacity:0}}

/* ---------- peron s ponudom ---------- */
#stage{position:absolute; left:0; right:0; top:calc(var(--u)*17); height:calc(var(--u)*31); display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*3); padding:0 calc(var(--u)*6)}
#loose{display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:calc(var(--u)*.8); max-width:calc(var(--u)*100)}
.opt{width:calc(var(--u)*21); height:calc(var(--u)*21); border-radius:calc(var(--u)*5); background:#fff; box-shadow:0 calc(var(--u)*1.1) 0 #00000026; font-size:calc(var(--u)*13); font-weight:800; line-height:1;
  display:flex; align-items:center; justify-content:center; transition:transform .12s; animation:drop .45s backwards}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
@keyframes drop{0%{transform:translateY(calc(var(--u)*-30)); opacity:0}70%{transform:translateY(calc(var(--u)*1.5))}}
.opt:hover,.opt.cur{transform:translateY(calc(var(--u)*-1.2)) scale(1.05); outline:calc(var(--u)*.9) solid var(--orange)}
.opt.num{color:#8a4dff}.opt.ltr{color:#2f7dff}
.opt.em,.loose{font-family:system-ui,"Segoe UI Emoji","Noto Color Emoji",sans-serif}
.loose{width:calc(var(--u)*13); height:calc(var(--u)*13); font-size:calc(var(--u)*9.6); line-height:calc(var(--u)*13); border-radius:calc(var(--u)*3); background:#ffffffb0; box-shadow:0 calc(var(--u)*.7) 0 #00000020; transition:transform .12s}
.loose:hover,.loose.cur{transform:scale(1.12); background:#fff; outline:calc(var(--u)*.7) solid var(--orange)}
.loose.gone{visibility:hidden}
#go{width:calc(var(--u)*19); height:calc(var(--u)*19); flex:none; border-radius:50%; background:#34c66b; color:#fff; font-size:calc(var(--u)*11); box-shadow:0 calc(var(--u)*1.2) 0 #1f9a4d; display:flex; align-items:center; justify-content:center}
#go:hover,#go.cur{transform:scale(1.08); outline:calc(var(--u)*.9) solid #fff}
#go.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.no{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(calc(var(--u)*-1.6))}40%,80%{transform:translateX(calc(var(--u)*1.6))}}
.hint{outline:calc(var(--u)*1) dashed #34c66b!important; animation:pulse 1s infinite}
.right{outline:calc(var(--u)*1) solid #34c66b!important; background:#dcffe9!important}
.cur{z-index:2}

/* ---------- gornja traka ---------- */
.round{position:fixed; top:calc(var(--u)*2); width:calc(var(--u)*8.5); height:calc(var(--u)*8.5); min-width:38px; min-height:38px; border-radius:50%; background:#fff; font-size:calc(var(--u)*4.2);
  box-shadow:0 calc(var(--u)*.6) 0 #00000026; display:flex; align-items:center; justify-content:center; text-decoration:none; z-index:20; font-family:system-ui,sans-serif}
#home,#back{left:calc(var(--u)*2)} #lnk1{left:calc(var(--u)*12.5)} #lnk2{left:calc(var(--u)*23)} #mute{right:calc(var(--u)*2)}
#bubble{position:fixed; top:calc(var(--u)*2); left:50%; transform:translateX(-50%); max-width:calc(var(--u)*120); background:#fff; border-radius:calc(var(--u)*4.5); padding:calc(var(--u)*1.2) calc(var(--u)*3.4);
  font-size:calc(var(--u)*3.6); font-weight:700; line-height:1.25; box-shadow:0 calc(var(--u)*.6) 0 #00000022; text-align:center; z-index:15}
#bubble:empty{display:none}
#prog{position:fixed; top:calc(var(--u)*12); left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:calc(var(--u)*1.4); z-index:14; font-size:calc(var(--u)*3.4); font-family:system-ui,sans-serif}
#prog i{width:calc(var(--u)*2.6); height:calc(var(--u)*2.6); border-radius:50%; background:#ffffff8c; box-shadow:inset 0 0 0 calc(var(--u)*.4) #ffffff}
#prog i.on{background:#ffcf3a; box-shadow:0 0 0 calc(var(--u)*.5) #fff}
#prog i.now{background:var(--orange); transform:scale(1.4)}

/* ---------- izbornik i dolazak ---------- */
.screen{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*4); text-align:center}
h1{margin:0; font-size:calc(var(--u)*15); font-weight:800; line-height:1; color:#fff; text-shadow:0 calc(var(--u)*.8) 0 var(--ink), 0 0 calc(var(--u)*4) #00000030}
h1 b{color:#ffd84a}
#dests{display:flex; gap:calc(var(--u)*4)}
.dest{width:calc(var(--u)*40); height:calc(var(--u)*44); border-radius:calc(var(--u)*6); color:#fff; box-shadow:0 calc(var(--u)*1.4) 0 #00000033; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:calc(var(--u)*.6); transition:transform .15s; position:relative; overflow:hidden}
.dest:nth-child(1){background:linear-gradient(#7fd4ff,#62c15c 70%)} .dest:nth-child(2){background:linear-gradient(#35b6f2,#f4d27e 78%)} .dest:nth-child(3){background:linear-gradient(#6a5acd,#ff9e7a 80%)}
.dest:hover,.dest.sel{transform:translateY(calc(var(--u)*-1.6)) scale(1.03); outline:calc(var(--u)*1.1) solid #fff}
.dest .ic{font-size:calc(var(--u)*18); line-height:1.1; font-family:system-ui,sans-serif; filter:drop-shadow(0 calc(var(--u)*.6) 0 #00000030)}
.dest .nm{font-size:calc(var(--u)*5.4); font-weight:800; line-height:1; text-shadow:0 calc(var(--u)*.4) 0 #00000040}
.dest .lv{font-size:calc(var(--u)*2.6); font-weight:700; opacity:.95}
.dest .st, #wstars{font-family:system-ui,sans-serif}
.dest .st{font-size:calc(var(--u)*4.4); letter-spacing:calc(var(--u)*.4); background:#ffffffd9; border-radius:calc(var(--u)*3); padding:0 calc(var(--u)*2)}
.st i,#wstars i{font-style:normal; opacity:.25; filter:grayscale(1)} .st i.on,#wstars i.on{opacity:1; filter:none}
#loading{font-size:calc(var(--u)*2.6); font-weight:700; color:#fff; min-height:calc(var(--u)*3.4); text-shadow:0 1px 2px #0006}
#win{background:#1b2340b8; color:#fff; z-index:18; gap:calc(var(--u)*2.5)}
#wicon{font-size:calc(var(--u)*22); line-height:1; font-family:system-ui,sans-serif; animation:pop .6s}
#wstars{font-size:calc(var(--u)*13); letter-spacing:calc(var(--u)*1.2)}
#wstars i.on{animation:pop .5s backwards} #wstars i:nth-child(2){animation-delay:.25s} #wstars i:nth-child(3){animation-delay:.5s}
#win .btns button{font-size:calc(var(--u)*7); width:calc(var(--u)*18); height:calc(var(--u)*14); border-radius:calc(var(--u)*4.5); margin:0 calc(var(--u)*1.2); background:#fff; box-shadow:0 calc(var(--u)*.9) 0 #b9cbe6; font-family:system-ui,sans-serif}
#win .btns button.go{background:var(--orange); box-shadow:0 calc(var(--u)*.9) 0 #b85a00}
.conf{position:fixed; top:-6vh; font-size:calc(var(--u)*5); z-index:19; pointer-events:none; animation:fall linear forwards; font-family:system-ui,sans-serif}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
</style>
</head>
<body class="t0">

  <div class="cloud a"></div><div class="cloud b"></div><div class="cloud c"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const NAME = 'Teo';

/* ---------- Bibine rečenice (sve se snimaju: alat\glas.py vlak) ---------- */
/*@LINES*/
const NUMS = ['Jedan','Dva','Tri','Četiri','Pet','Šest','Sedam','Osam','Devet','Deset'];
const NUMACC = ['jednu','dvije','tri','četiri','pet','šest','sedam','osam','devet','deset'];
const LOADS = [['🍎',['jabuku','jabuke','jabuka']], ['🍌',['bananu','banane','banana']], ['⚽',['loptu','lopte','lopti']], ['🐟',['ribu','ribe','riba']],
  ['⭐',['zvijezdu','zvijezde','zvijezda']], ['🍐',['krušku','kruške','krušaka']], ['🥕',['mrkvu','mrkve','mrkava']]];
const ANIMALS = [['🐘','Slon'],['🦒','Žirafa'],['🐢','Kornjača'],['🐇','Zec'],['🦆','Patka'],['🦋','Leptir'],['🐟','Riba'],['🐍','Zmija'],['🦀','Rak'],['🐊','Krokodil'],['🦉','Sova'],['🐓','Pijetao'],
  ['🐕','Pas'],['🐈','Mačka'],['🐎','Konj'],['🐄','Krava'],['🐖','Svinja'],['🦌','Jelen'],['🐪','Deva']];
const QUAD = 7; // zadnjih sedam životinja ima slične sjene (četiri noge) — za najtežu razinu
const WORDS = [['🚗','Auto','A'],['🍌','Banana','B'],['🎈','Balon','B'],['🌳','Drvo','D'],['🍇','Grožđe','G'],['🍎','Jabuka','J'],['🏠','Kuća','K'],['🐴','Konj','K'],['⚽','Lopta','L'],['🍉','Lubenica','L'],
  ['🐱','Mačka','M'],['🐭','Miš','M'],['👃','Nos','N'],['☁️','Oblak','O'],['🐶','Pas','P'],['🐝','Pčela','P'],['🐟','Riba','R'],['🐘','Slon','S'],['🧀','Sir','S'],['🐯','Tigar','T'],['👂','Uho','U'],['🚂','Vlak','V'],['🦓','Zebra','Z'],['🦷','Zub','Z']];
const T = {

    const p = el('i', 'puff'), r = $('#loco').getBoundingClientRect(), tr = train.getBoundingClientRect();
    p.style.left = (r.left - tr.left + r.width*.68) + 'px'; p.style.top = (r.top - tr.top - r.height*.02) + 'px';
    train.appendChild(p); setTimeout(() => p.remove(), 1500);
  }, 170);
}
function slide(x, ms, ease){
  train.style.transition = ms ? 'transform ' + ms + 'ms ' + ease : 'none';
  train.style.transform = 'translateX(' + x + ')';
  if(!ms) void train.offsetWidth;
  return wait(ms);
}
async function nextTask(spoken){
  const my = run; busy = true; cur = -1;
  moving(true); sfx.chug(8);
  if(step > 0 || wagons.children.length) await slide('140vw', 900, 'cubic-bezier(.5,0,.9,.4)');
  if(my !== run) return;
  if(step >= STOPS) return arrive();
  await slide('-140vw', 0);
  wagons.innerHTML = ''; stage.innerHTML = ''; stage.hidden = false; tErr = 0;
  const line = TASKS[plan[step]](dest);
  drawProg();
  await slide('0', 1100, 'cubic-bezier(.1,.6,.3,1)');
  if(my !== run) return;
  moving(false);
  if(spoken) await Promise.race([spoken, wait(4500)]);
  if(my !== run) return;
  busy = false; say(line);
}
async function solved(extra){
  const my = run; busy = true; step++; sfx.ok(); happy(true); drawProg();
  document.querySelectorAll('.hint').forEach(e => e.classList.remove('hint'));
  const p = say((extra ? extra + ' ' : '') + pick(PRAISE));
  await Promise.all([wait(1500), Promise.race([p, wait(6000)])]);
  if(my !== run) return;
  if(step >= STOPS) sfx.whistle();
  nextTask();
}
function arrive(){
  moving(false); stage.hidden = true; wagons.innerHTML = '';
  const st = errors <= 1 ? 3 : errors <= 4 ? 2 : 1, id = DEST[dest].id;
  save[id] = Math.max(save[id]||0, st); store();
  $('#wicon').textContent = DEST[dest].icon; $('#wstars').innerHTML = starHtml(st); $('#wnext').hidden = dest >= DEST.length-1;
  screen = 'win'; $('#win').hidden = false; $('#prog').hidden = true; $('#back').hidden = true; sfx.fanfare(); happy(true);
  for(let i = 0; i < 26; i++){ const c = el('i', 'conf', pick(['🎉','⭐','🎈','✨','🎊'])); c.style.left = rnd(2,96) + 'vw'; c.style.animationDuration = (2.2 + Math.random()*2.2) + 's'; c.style.animationDelay = Math.random()*1.2 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 6000); }
  const my = run; setTimeout(() => { if(my === run && screen === 'win') say(ARR[dest]); }, 700);
}
function startTrip(d){
  ensureAc(); run++; dest = d; step = 0; errors = 0; plan = makePlan(d); screen = 'game'; greeted = true;
  setTheme(d); $('#menu').hidden = true; $('#win').hidden = true; $('#prog').hidden = false; $('#back').hidden = false;
  ['#home','#lnk1','#lnk2'].forEach(s => $(s).hidden = true);
  wagons.innerHTML = ''; slide('-140vw', 0); drawProg(); sfx.whistle();
  nextTask(say(GO[d]));
}
function showMenu(quiet){
  run++; screen = 'menu'; busy = true; moving(false); stopVoice();
  $('#menu').hidden = false; $('#win').hidden = true; $('#prog').hidden = true; $('#back').hidden = true; stage.hidden = true;
  ['#home','#lnk1','#lnk2'].forEach(s => $(s).hidden = false);
  slide('-140vw', 0); wagons.innerHTML = ''; bubble.textContent = '';
  const box = $('#dests'); box.innerHTML = '';
  DEST.forEach((d, i) => { const b = el('button', 'dest' + (i === sel ? ' sel' : ''), '<span class="ic">' + d.icon + '</span><span class="nm">' + d.name + '</span><span class="lv">' + d.lv + '</span><span class="st">' + starHtml(save[d.id]||0) + '</span>');
    b.setAttribute('aria-label', d.name); b.onclick = () => startTrip(i); box.appendChild(b); });
  if(!quiet) say(T.menu);
}
$('#wagain').onclick = () => startTrip(dest);
$('#wnext').onclick = () => startTrip(Math.min(DEST.length-1, dest+1));
$('#wmenu').onclick = () => { sel = dest; showMenu(); };
$('#back').onclick = () => { sel = dest; showMenu(true); };
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; if(muted) stopVoice(); $('#mute').blur(); };
addEventListener('pointerdown', e => { if(!greeted && screen === 'menu' && !e.target.closest('.dest,a,button')){ greeted = true; ensureAc(); say(T.hi); } });

const picks = () => [...document.querySelectorAll('#scene .pick')].filter(e => !e.classList.contains('gone'));
function setCur(i){ const p = picks(); if(!p.length) return; cur = (i + p.length) % p.length; document.querySelectorAll('.cur').forEach(e => e.classList.remove('cur')); p[cur].classList.add('cur'); }
addEventListener('keydown', e => {
  const k = e.code;
  if(k === 'Space' || k.startsWith('Arrow')) e.preventDefault();
  if(e.repeat && (k === 'Space' || k === 'Enter')) return;
  if(screen === 'menu'){
    const n = DEST.length;
    if(k === 'ArrowRight' || k === 'ArrowDown') sel = Math.min(n-1, sel+1); else if(k === 'ArrowLeft' || k === 'ArrowUp') sel = Math.max(0, sel-1);
    else if(k === 'Space' || k === 'Enter'){ e.preventDefault(); startTrip(sel); return; } else return;
    [...$('#dests').children].forEach((b, i) => b.classList.toggle('sel', i === sel));
    if(!greeted){ greeted = true; ensureAc(); say(T.hi); }
  } else if(screen === 'game'){
    if(k === 'Escape'){ sel = dest; showMenu(true); return; }
    if(busy) return;
    if(k === 'ArrowRight' || k === 'ArrowDown') setCur(cur + 1); else if(k === 'ArrowLeft' || k === 'ArrowUp') setCur(cur < 0 ? picks().length-1 : cur - 1);
    else if(k === 'Space' || k === 'Enter'){ e.preventDefault(); const p = picks(); if(cur < 0) setCur(0); else if(p[cur]){ const t = p[cur]; t.click(); if(t.classList.contains('gone')) setCur(Math.min(cur, picks().length-1)); } }
  } else if(screen === 'win'){
    if(k === 'Space' || k === 'Enter'){ e.preventDefault(); dest < DEST.length-1 ? startTrip(dest+1) : showMenu(); }
    else if(k === 'Escape') showMenu(true);
  }
});
setTheme(0);
loadPack().then(() => { $('#loading').textContent = ''; });
setTimeout(() => { $('#loading').textContent = ''; }, 8000);
showMenu(true);
</script>
